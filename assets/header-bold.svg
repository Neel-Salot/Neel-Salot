<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <!-- Dramatic gradient background -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="30%" stop-color="#16213e"/>
      <stop offset="70%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    
    <!-- Gold accent gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="50%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    
    <!-- Neon pink accent -->
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ff8fab"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#heroBg)"/>

  <!-- Abstract art elements - floating geometric shapes -->
  <g opacity="0.15">
    <!-- Circle 1 -->
    <circle cx="80" cy=" being 60" r="40" fill="none" stroke="#d4a373" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 80 60" to="360 80 60" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Triangle -->
    <polygon points="820,50 850,100 790,100" fill="none" stroke="#ff6b9d" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 820 75" to="-360 820 75" dur="15s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Floating squares -->
    <rect x="50" y="300" width="30" height="30" fill="none" stroke="#d4a373" stroke-width="1" transform="rotate(45, 65, 315)">
      <animateTransform attributeName="transform" type="rotate" from="45 65 315" to="405 65 315" dur="10s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="830" y="280" width="25" height="25" fill="none" stroke="#ff6b9d" stroke-width="1" transform="rotate(30, 842, 292)">
      <animateTransform attributeName="transform" type="rotate" from="30 842 292" to="390 842 292" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Artistic line art - abstract wings/feathers -->
  <g transform="translate(450, 280)" opacity="0.08">
    <path d="M0,0 Q-100,-80 -200,-20" stroke="#d4a373" stroke-width="1" fill="none"/>
    <path d="M0,0 Q-80,-100 -160,-60" stroke="#d4a373" stroke-width="1" fill="none"/>
    <path d="M0,0 Q-60,-110 -120,-80" stroke="#d4a373" stroke-width="1" fill="none"/>
    <path d="M0,0 Q100,-80 200,-20" stroke="#d4a373" stroke-width="1" fill="none"/>
    <path d="M0,0 Q80,-100 160,-60" stroke="#d4a373" stroke-width="1" fill="none"/>
    <path d="M0,0 Q60,-110 120,-80" stroke="#d4a373" stroke-width="1" fill="none"/>
  </g>

  <!-- Main title - dramatic serif with AI wordplay -->
  <text x="450" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#textShadow)">
    NEEL SALOT
  </text>
  
  <!-- Subtitle with AI twist - the "AI" highlighted -->
  <text x="450" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#d4a373" text-anchor="middle" letter-spacing="3" font-style="italic">
    Full Stack · 
    <tspan fill="#ff6b9d" filter="url(#glow)">AI</tspan>
    Builder · Systems Thinker
  </text>

  <!-- Decorative line with gradient -->
  <line x1="250" y1="200" x2="650" y2="200" stroke="url(#goldAccent)" stroke-width="1" opacity="0.6"/>

  <!-- Floating accent particles -->
  <g>
    <circle cx="280" cy="220" r="2" fill="#ff6b9d" opacity="0.8">
      <animate attributeName="cy" values="220;215;220" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="225" r="3" fill="#d4a373" opacity="0.7">
      <animate attributeName="cy" values="225;218;225" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="218" r="2" fill="#ff6b9d" opacity="0.8">
      <animate attributeName="cy" values="218;225;218" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Location tag - elegant styling -->
  <g transform="translate(450, 250)">
    <!-- Pin icon -->
    <circle cx="-40" cy="0" r="6" fill="none" stroke="#d4a373" stroke-width="1.5"/>
    <circle cx="-40" cy="0" r="2" fill="#ff6b9d"/>
    
    <text x="-25" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#a0a0b0" letter-spacing="2">
      SURAT, GUJARAT
    </text>
  </g>

  <!-- Bold accent bar at bottom -->
  <rect x="0" y="380" width="900" height="20" fill="url(#heroBg)"/>
  <rect x="350" y="385" width="200" height="10" rx="5" fill="url(#goldAccent)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents - artistic framing -->
  <text x="30" y="370" font-family="Georgia, serif" font-size="24" fill="#d4a373" opacity="0.3">✦</text>
  <text x="860" y="370" font-family="Georgia, serif" font-size="24" fill="#d4a373" opacity="0.3">✦</text>

  <!-- Animated border lines -->
  <line x1="20" y1="20" x2="100" y2="20" stroke="#d4a373" stroke-width="0.5" opacity="0.4">
    <animate attributeName="x2" values="100;120;100" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#d4a373" stroke-width="0.5" opacity="0.4">
    <animate attributeName="y2" values="80;100;80" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <line x1="880" y1="20" x2="800" y2="20" stroke="#ff6b9d" stroke-width="0.5" opacity="0.4">
    <animate attributeName="x2" values="800;780;800" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="880" y1="20" x2="880" y2="80" stroke="#ff6b9d" stroke-width="0.5" opacity="0.4">
    <animate attributeName="y2" values="80;100;80" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Roman numerals - classical touch -->
  <text x="880" y="100" font-family="Georgia, serif" font-size="10" fill="#d4a373" opacity="0.2" text-anchor="end">
    I · II · III · IV · V
  </text>
  <text x="880" y="120" font-family="Georgia, serif" font-size="10" fill="#d4a373" opacity="0.15" text-anchor="end">
    VI · VII · VIII
  </text>
</svg>
