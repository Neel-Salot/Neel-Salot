<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <defs>
    <filter id="kglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="280" height="200" fill="#0a0a12"/>

  <!-- Isometric display case -->
  <polygon points="20,30 260,30 280,18 40,18" fill="#14141f" stroke="#2a2a3e" stroke-width="1"/>
  <polygon points="20,30 260,30 260,170 20,170" fill="#0d0d18" stroke="#2a2a3e" stroke-width="1"/>
  <polygon points="260,30 280,18 280,158 260,170" fill="#0a0a12" stroke="#2a2a3e" stroke-width="1"/>
  <polygon points="28,35 252,35 252,163 28,163" fill="#0a0a12" stroke="#1e1e30" stroke-width="0.5"/>

  <!-- Project title -->
  <text x="140" y="60" font-family="monospace" font-size="16" font-weight="bold" fill="#e0e0ff" text-anchor="middle" letter-spacing="1">KAIRO AI</text>

  <line x1="50" y1="68" x2="230" y2="68" stroke="#bd93f9" stroke-width="0.8" opacity="0.5"/>

  <!-- Badges -->
  <rect x="40" y="74" width="80" height="14" rx="2" fill="#bd93f9" fill-opacity="0.1" stroke="#bd93f9" stroke-width="0.5"/>
  <text x="80" y="84" font-family="monospace" font-size="8" fill="#bd93f9" text-anchor="middle">ACAi-2026 PAPER</text>

  <rect x="125" y="74" width="75" height="14" rx="2" fill="#f1fa8c" fill-opacity="0.1" stroke="#f1fa8c" stroke-width="0.5"/>
  <text x="162" y="84" font-family="monospace" font-size="8" fill="#f1fa8c" text-anchor="middle">NATIONAL CONF</text>

  <rect x="205" y="74" width="45" height="14" rx="2" fill="#ff79c6" fill-opacity="0.1" stroke="#ff79c6" stroke-width="0.5"/>
  <text x="227" y="84" font-family="monospace" font-size="8" fill="#ff79c6" text-anchor="middle">RESEARCH</text>

  <!-- Description -->
  <text x="42" y="102" font-family="monospace" font-size="9" fill="#6a6a9a">
    <tspan x="42" dy="0">Indian Sign Language</tspan>
    <tspan x="42" dy="12">Learning Platform</tspan>
  </text>

  <!-- Hand gesture visualization -->
  <g transform="translate(30, 108)">
    <!-- Simplified hand outline using paths -->
    <ellipse cx="20" cy="30" rx="14" ry="18" fill="#1a1a28" stroke="#bd93f9" stroke-width="0.8" opacity="0.6"/>
    <!-- Finger lines -->
    <path d="M10,18 Q14,10 20,12 Q26,10 30,18" stroke="#bd93f9" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M12,22 L12,32 M16,20 L16,34 M20,18 L20,35 M24,20 L24,34 M28,22 L28,32" stroke="#bd93f9" stroke-width="0.5" fill="none" opacity="0.4"/>
    <!-- MediaPipe indicator -->
    <circle cx="55" cy="25" r="8" fill="none" stroke="#50fa7b" stroke-width="0.8" opacity="0.5"/>
    <text x="55" y="28" font-family="monospace" font-size="6" fill="#50fa7b" text-anchor="middle">MP</text>
  </g>

  <!-- Tech stack -->
  <text x="130" y="118" font-family="monospace" font-size="8" fill="#4a4a6a">Flutter · Firebase · MediaPipe · TensorFlow Lite</text>

  <!-- Impact bullets -->
  <text x="42" y="140" font-family="monospace" font-size="8" fill="#4a4a6a">▸</text>
  <text x="52" y="140" font-family="monospace" font-size="8" fill="#5a5a7a">Real-time gesture feedback</text>

  <text x="42" y="154" font-family="monospace" font-size="8" fill="#4a4a6a">▸</text>
  <text x="52" y="154" font-family="monospace" font-size="8" fill="#5a5a7a">National conference publication</text>

  <text x="42" y="166" font-family="monospace" font-size="8" fill="#4a4a6a">▸</text>
  <text x="52" y="166" font-family="monospace" font-size="8" fill="#5a5a7a">Self-correct learning system</text>

  <!-- Corner accent -->
  <path d="M20,30 L20,170 M20,30 L260,30" stroke="#bd93f9" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="20" cy="30" r="2" fill="#bd93f9" filter="url(#kglow)"/>
  <circle cx="258" cy="167" r="3" fill="#bd93f9" opacity="0.6"/>

</svg>
