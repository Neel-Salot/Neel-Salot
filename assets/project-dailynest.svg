<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210">
  <defs>
    <filter id="dglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
  </defs>

  <rect width="280" height="210" fill="url(#cardGrad3)"/>

  <!-- Floating particles -->
  <circle cx="50" cy="40" r="1.5" fill="#50fa7b" opacity="0.5">
    <animate attributeName="cy" values="40;35;40" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="25" r="1" fill="#fbbf24" opacity="0.6">
    <animate attributeName="cy" values="25;20;25" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Card border glow -->
  <rect x="2" y="2" width="276" height="206" rx="8" fill="none" stroke="#50fa7b" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <rect x="10" y="10" width="260" height="190" rx="6" fill="#1a0a2e" stroke="#2a1a4a" stroke-width="1"/>

  <!-- Accent bar -->
  <rect x="10" y="10" width="260" height="3" rx="1.5" fill="#50fa7b" opacity="0.8"/>

  <!-- Title -->
  <text x="140" y="42" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#dglow)">DAILYNEST</text>

  <text x="140" y="60" font-family="Arial, sans-serif" font-size="9" fill="#50fa7b" text-anchor="middle">AI Autism Support Platform</text>

  <!-- Badges -->
  <rect x="18" y="72" width="80" height="16" rx="8" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="58" y="83" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">★ BEST PAPER</text>

  <rect x="103" y="72" width="80" height="16" rx="8" fill="#ff6b9d" fill-opacity="0.15" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="143" y="83" font-family="monospace" font-size="8" fill="#ff6b9d" text-anchor="middle">NATIONAL CONF</text>

  <rect x="188" y="72" width="55" height="16" rx="8" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="0.8"/>
  <text x="215" y="83" font-family="monospace" font-size="8" fill="#a855f7" text-anchor="middle">AI · ML</text>

  <!-- Module flow -->
  <g transform="translate(15, 95)">
    <rect x="0" y="0" width="42" height="20" rx="3" fill="#1a0a2e" stroke="#50fa7b" stroke-width="0.8" opacity="0.7"/>
    <text x="21" y="13" font-family="monospace" font-size="6" fill="#50fa7b" text-anchor="middle">DAY PLANNER</text>

    <rect x="46" y="0" width="42" height="20" rx="3" fill="#1a0a2e" stroke="#a855f7" stroke-width="0.8" opacity="0.7"/>
    <text x="67" y="13" font-family="monospace" font-size="6" fill="#a855f7" text-anchor="middle">EMOTION</text>

    <rect x="92" y="0" width="48" height="20" rx="3" fill="#1a0a2e" stroke="#ff6b9d" stroke-width="0.8" opacity="0.7"/>
    <text x="116" y="13" font-family="monospace" font-size="6" fill="#ff6b9d" text-anchor="middle">COMM ASST</text>

    <rect x="144" y="0" width="52" height="20" rx="3" fill="#1a0a2e" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
    <text x="170" y="13" font-family="monospace" font-size="6" fill="#fbbf24" text-anchor="middle">CAREGIVER</text>
  </g>

  <!-- Impact -->
  <text x="25" y="140" font-family="monospace" font-size="9" fill="#8888aa">▸</text>
  <text x="35" y="140" font-family="monospace" font-size="9" fill="#aaaacc">Multi-module ASD support system</text>

  <text x="25" y="156" font-family="monospace" font-size="9" fill="#8888aa">▸</text>
  <text x="35" y="156" font-family="monospace" font-size="9" fill="#aaaacc">AI pattern detection for stress triggers</text>

  <text x="25" y="172" font-family="monospace" font-size="9" fill="#8888aa">▸</text>
  <text x="35" y="172" font-family="monospace" font-size="9" fill="#aaaacc">Best Research Paper Award winner</text>

  <!-- Sparkle -->
  <g transform="translate(240, 180)" filter="url(#dglow)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#50fa7b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#50fa7b" stroke-width="1.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="1.5s" repeatCount="indefinite"/>
  </g>

</svg>
