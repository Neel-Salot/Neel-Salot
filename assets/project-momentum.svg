<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <defs>
    <filter id="pglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="mTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="mFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#111120"/>
    </linearGradient>
    <linearGradient id="mSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0e0e1c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" fill="#0a0a12"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ISOMETRIC DISPLAY CASE                          -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Back shadow -->
  <polygon points="20,30 260,30 280,18 40,18" fill="#08080f" opacity="0.5"/>

  <!-- Top face -->
  <polygon points="20,30 260,30 280,18 40,18" fill="#14141f" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Front face -->
  <polygon points="20,30 260,30 260,170 20,170" fill="#0d0d18" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Right face -->
  <polygon points="260,30 280,18 280,158 260,170" fill="#0a0a12" stroke="#2a2a3e" stroke-width="1"/>

  <!-- Inner content area -->
  <polygon points="28,35 252,35 252,163 28,163" fill="#0a0a12" stroke="#1e1e30" stroke-width="0.5"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- HEADER SECTION                                  -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Project title -->
  <text x="140" y="60" font-family="monospace" font-size="16" font-weight="bold" fill="#e0e0ff" text-anchor="middle" letter-spacing="1">MOMENTUM AI</text>

  <!-- Accent line -->
  <line x1="50" y1="68" x2="230" y2="68" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>

  <!-- Badge: Hackathon -->
  <rect x="50" y="74" width="70" height="14" rx="2" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="85" y="84" font-family="monospace" font-size="8" fill="#00d4ff" text-anchor="middle">⚡ HACKATHON</text>

  <!-- Badge: Built in -->
  <rect x="125" y="74" width="60" height="14" rx="2" fill="#bd93f9" fill-opacity="0.1" stroke="#bd93f9" stroke-width="0.5"/>
  <text x="155" y="84" font-family="monospace" font-size="8" fill="#bd93f9" text-anchor="middle">48 HRS</text>

  <!-- Badge: AI -->
  <rect x="190" y="74" width="40" height="14" rx="2" fill="#50fa7b" fill-opacity="0.1" stroke="#50fa7b" stroke-width="0.5"/>
  <text x="210" y="84" font-family="monospace" font-size="8" fill="#50fa7b" text-anchor="middle">◉ AI</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- DESCRIPTION                                    -->
  <!-- ═══════════════════════════════════════════════ -->

  <text x="42" y="102" font-family="monospace" font-size="9" fill="#6a6a9a">
    <tspan x="42" dy="0">Meeting Intelligence &amp;</tspan>
    <tspan x="42" dy="12">Execution System</tspan>
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- TECH FLOW DIAGRAM                               -->
  <!-- ═══════════════════════════════════════════════ -->

  <g transform="translate(30, 112)">
    <!-- Whisper node -->
    <rect x="0" y="0" width="36" height="18" rx="2" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="18" y="12" font-family="monospace" font-size="7" fill="#7a7a9a" text-anchor="middle">Whisper</text>

    <!-- Arrow -->
    <path d="M39,9 L50,9" stroke="#3a3a5e" stroke-width="0.8"/>
    <path d="M47,6 L51,9 L47,12" stroke="#3a3a5e" stroke-width="0.8" fill="none"/>

    <!-- Gemini node -->
    <rect x="53" y="0" width="36" height="18" rx="2" fill="#0f0f1a" stroke="#bd93f9" stroke-width="0.8" opacity="0.8"/>
    <text x="71" y="12" font-family="monospace" font-size="7" fill="#bd93f9" text-anchor="middle">Gemini</text>

    <!-- Arrow -->
    <path d="M92,9 L103,9" stroke="#3a3a5e" stroke-width="0.8"/>
    <path d="M100,6 L104,9 L100,12" stroke="#3a3a5e" stroke-width="0.8" fill="none"/>

    <!-- Supabase node -->
    <rect x="106" y="0" width="44" height="18" rx="2" fill="#0f0f1a" stroke="#50fa7b" stroke-width="0.8" opacity="0.7"/>
    <text x="128" y="12" font-family="monospace" font-size="7" fill="#50fa7b" text-anchor="middle">Supabase</text>
  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- IMPACT BULLETS                                  -->
  <!-- ═══════════════════════════════════════════════ -->

  <text x="42" y="142" font-family="monospace" font-size="8" fill="#4a4a6a">▸</text>
  <text x="52" y="142" font-family="monospace" font-size="8" fill="#5a5a7a">Built end-to-end AI pipeline</text>

  <text x="42" y="154" font-family="monospace" font-size="8" fill="#4a4a6a">▸</text>
  <text x="52" y="154" font-family="monospace" font-size="8" fill="#5a5a7a">48hr OceanLab × CHARUSAT win</text>

  <text x="42" y="166" font-family="monospace" font-size="8" fill="#4a4a6a">▸</text>
  <text x="52" y="166" font-family="monospace" font-size="8" fill="#5a5a7a">Zero manual formatting</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CORNER ACCENTS                                  -->
  <!-- ═══════════════════════════════════════════════ -->

  <path d="M20,30 L20,170 M20,30 L260,30" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="20" cy="30" r="2" fill="#00d4ff" filter="url(#pglow)"/>

  <!-- Bottom right indicator -->
  <circle cx="258" cy="167" r="3" fill="#00d4ff" opacity="0.6"/>

</svg>
