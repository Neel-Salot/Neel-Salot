<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210">
  <defs>
    <filter id="pglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="280" height="210" fill="url(#cardGrad)"/>

  <!-- Floating particles in background -->
  <circle cx="30" cy="30" r="1" fill="#ff6b9d" opacity="0.6">
    <animate attributeName="cy" values="30;25;30" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="50" r="1.5" fill="#00d4ff" opacity="0.5">
    <animate attributeName="cy" values="50;45;50" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="180" r="1" fill="#fbbf24" opacity="0.5">
    <animate attributeName="cy" values="180;175;180" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Card border glow -->
  <rect x="2" y="2" width="276" height="206" rx="8" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main card -->
  <rect x="10" y="10" width="260" height="190" rx="6" fill="#1a0a2e" stroke="#2a1a4a" stroke-width="1"/>

  <!-- Accent bar top -->
  <rect x="10" y="10" width="260" height="3" rx="1.5" fill="#ff6b9d" opacity="0.8"/>

  <!-- Project title -->
  <text x="140" y="42" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#pglow)">MOMENTUM AI</text>

  <!-- Tagline -->
  <text x="140" y="60" font-family="Arial, sans-serif" font-size="9" fill="#a855f7" text-anchor="middle">Meeting Intelligence &amp; Execution System</text>

  <!-- Badges row -->
  <rect x="25" y="72" width="65" height="16" rx="8" fill="#ff6b9d" fill-opacity="0.15" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="57" y="83" font-family="monospace" font-size="8" fill="#ff6b9d" text-anchor="middle">⚡ 48-HR BUILD</text>

  <rect x="95" y="72" width="70" height="16" rx="8" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="130" y="83" font-family="monospace" font-size="8" fill="#00d4ff" text-anchor="middle">◉ AI PIPELINE</text>

  <rect x="170" y="72" width="75" height="16" rx="8" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="207" y="83" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">★ HACKATHON</text>

  <!-- Flow diagram -->
  <g transform="translate(20, 98)">
    <rect x="0" y="0" width="45" height="22" rx="4" fill="#1a0a2e" stroke="#00d4ff" stroke-width="1"/>
    <text x="22" y="14" font-family="monospace" font-size="8" fill="#00d4ff" text-anchor="middle">Whisper</text>

    <path d="M48,11 L60,11" stroke="#a855f7" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M56,8 L60,11 L56,14" stroke="#a855f7" stroke-width="1" fill="none"/>

    <rect x="63" y="0" width="45" height="22" rx="4" fill="#1a0a2e" stroke="#a855f7" stroke-width="1"/>
    <text x="85" y="14" font-family="monospace" font-size="8" fill="#a855f7" text-anchor="middle">Gemini</text>

    <path d="M111,11 L123,11" stroke="#50fa7b" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M119,8 L123,11 L119,14" stroke="#50fa7b" stroke-width="1" fill="none"/>

    <rect x="126" y="0" width="50" height="22" rx="4" fill="#1a0a2e" stroke="#50fa7b" stroke-width="1"/>
    <text x="151" y="14" font-family="monospace" font-size="8" fill="#50fa7b" text-anchor="middle">Supabase</text>
  </g>

  <!-- Impact points -->
  <text x="25" y="140" font-family="monospace" font-size="9" fill="#8888aa">▸</text>
  <text x="35" y="140" font-family="monospace" font-size="9" fill="#aaaacc">End-to-end AI pipeline built in 48 hours</text>

  <text x="25" y="156" font-family="monospace" font-size="9" fill="#8888aa">▸</text>
  <text x="35" y="156" font-family="monospace" font-size="9" fill="#aaaacc">OceanLab × CHARUSAT hackathon winner</text>

  <text x="25" y="172" font-family="monospace" font-size="9" fill="#8888aa">▸</text>
  <text x="35" y="172" font-family="monospace" font-size="9" fill="#aaaacc">Zero manual formatting required</text>

  <!-- Fun accent - sparkle -->
  <g transform="translate(240, 180)" filter="url(#pglow)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="1.5s" repeatCount="indefinite"/>
  </g>

</svg>
