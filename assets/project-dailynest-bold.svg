<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    
    <linearGradient id="lavenderFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9575cd"/>
      <stop offset="100%" stop-color="#b39ddb"/>
    </linearGradient>
    
    <linearGradient id="coralFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#ffab91"/>
    </linearGradient>
    
    <linearGradient id="mintFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#80cbc4"/>
    </linearGradient>

    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="softGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="420" fill="url(#cardBg3)" rx="16"/>

  <!-- Animated background -->
  <g stroke="#2a2a4a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="700" y2="80">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="160" x2="700" y2="160"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="320" x2="700" y2="320"/>
    <line x1="140" y1="0" x2="140" y2="420"/>
    <line x1="280" y1="0" x2="280" y2="420"/>
    <line x1="420" y1="0" x2="420" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
  </g>

  <!-- Floating accents -->
  <g opacity="0.1">
    <circle cx="80" cy="50" r="20" fill="none" stroke="#9575cd" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 80 50" to="360 80 50" dur="20s" repeatCount="indefinite"/>
    </circle>
    <rect x="600" y="350" width="30" height="30" fill="none" stroke="#ff8a65" stroke-width="1" transform="rotate(45, 615, 365)">
      <animateTransform attributeName="transform" type="rotate" from="45 615 365" to="405 615 365" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Title section -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="6" height="40" rx="3" fill="url(#lavenderFlow)" filter="url(#glow3)"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="26" fill="#ffffff" font-weight="600">
      DailyNest
    </text>
    <text x="20" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#9575cd" letter-spacing="1">
      AI-POWERED AUTISM SUPPORT
    </text>
  </g>

  <!-- Award badge -->
  <g transform="translate(450, 45)">
    <rect x="0" y="-15" width="200" height="30" rx="15" fill="#d4a373" opacity="0.15"/>
    <text x="100" y="5" font-family="-apple-system, sans-serif" font-size="10" fill="#d4a373" text-anchor="middle" letter-spacing="1">
      ★ BEST RESEARCH PAPER AWARD
    </text>
  </g>

  <!-- AI Brain visualization -->
  <g transform="translate(50, 105)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#4a6a8a" letter-spacing="1">◉ PATTERN ANALYSIS</text>
    
    <g transform="translate(20, 20)">
      <!-- Neural network visualization -->
      <g stroke="#d4d4d4" stroke-width="1" opacity="0.4">
        <line x1="50" y1="18" x2="50" y2="8"/>
        <line x1="58" y1="26" x2="70" y2="22"/>
        <line x1="42" y1="26" x2="30" y2="22"/>
        <line x1="58" y1="34" x2="70" y2="38"/>
        <line x1="42" y1="34" x2="30" y2="38"/>
      </g>
      
      <!-- Central brain node -->
      <circle cx="50" cy="30" r="15" fill="#1a1a2e" stroke="url(#lavenderFlow)" stroke-width="2"/>
      <circle cx="50" cy="30" r="8" fill="#9575cd">
        <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#9575cd;#b39ddb;#9575cd" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Pulsing satellite nodes -->
      <circle cx="50" cy="6" r="5" fill="#ff8a65">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="20" r="5" fill="#4db6ac">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="28" cy="20" r="5" fill="#9575cd">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="72" cy="40" r="5" fill="#ff8a65">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <circle cx="28" cy="40" r="5" fill="#4db6ac">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
    </g>
    
    <!-- Stress level indicator -->
    <g transform="translate(120, 30)">
      <rect x="0" y="0" width="90" height="35" rx="6" fill="#1a1a2e" stroke="#4db6ac" stroke-width="1"/>
      <text x="10" y="15" font-family="-apple-system, sans-serif" font-size="9" fill="#6a6a8a">Stress Level</text>
      <rect x="10" y="20" width="60" height="6" rx="3" fill="#1a1a2e"/>
      <rect x="10" y="20" width="15" height="6" rx="3" fill="#4db6ac">
        <animate attributeName="width" values="15;25;15" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="75" y="26" font-family="-apple-system, sans-serif" font-size="8" fill="#4db6ac">LOW</text>
    </g>
  </g>

  <!-- Tech stack flow -->
  <g transform="translate(50, 185)">
    <!-- Flow arrows -->
    <line x1="80" y1="25" x2="150" y2="25" stroke="url(#lavenderFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#9575cd" filter="url(#softGlow3)">
      <animate attributeName="cx" values="80;150" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <line x1="230" y1="25" x2="300" y2="25" stroke="url(#coralFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </line>
    <circle r="4" fill="#ff8a65" filter="url(#softGlow3)">
      <animate attributeName="cx" values="230;300" dur="1s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    
    <line x1="380" y1="25" x2="450" y2="25" stroke="url(#mintFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite" begin="0.8s"/>
    </line>
    <circle r="4" fill="#4db6ac" filter="url(#softGlow3)">
      <animate attributeName="cx" values="380;450" dur="1s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <!-- Node boxes -->
    <g>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#9575cd" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#9575cd" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#9575cd" text-anchor="middle" font-weight="bold">CNN</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Pattern Detection</text>
    </g>

    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#ff8a65" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#ff8a65" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#ff8a65" text-anchor="middle" font-weight="bold">ML ENGINE</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Stress Analysis</text>
    </g>

    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#4db6ac" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#4db6ac" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#4db6ac" text-anchor="middle" font-weight="bold">NLP</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Sentiment</text>
    </g>

    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#d4a373" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#d4a373" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#d4a373" text-anchor="middle" font-weight="bold">DJANGO</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Backend</text>
    </g>
  </g>

  <!-- Support modules -->
  <g transform="translate(50, 270)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" fill="#6a6a8a" letter-spacing="1">SUPPORT MODULES</text>
    
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#1a1a2e" stroke="#9575cd" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="65" rx="8" fill="none" stroke="#9575cd" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="15" y="22" font-family="monospace" font-size="11" fill="#9575cd" font-weight="bold">DAILY JOURNAL</text>
      <text x="15" y="40" font-family="-apple-system, sans-serif" font-size="9" fill="#6a6a8a">Track emotions daily</text>
      <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#4a8a6a">AI pattern detection</text>
    </g>

    <g transform="translate(215, 15)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#1a1a2e" stroke="#ff8a65" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="65" rx="8" fill="none" stroke="#ff8a65" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <text x="15" y="22" font-family="monospace" font-size="11" fill="#ff8a65" font-weight="bold">TRIGGER ALERTS</text>
      <text x="15" y="40" font-family="-apple-system, sans-serif" font-size="9" fill="#6a6a8a">Early warning system</text>
      <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#4a8a6a">Real-time monitoring</text>
    </g>

    <g transform="translate(430, 15)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#1a1a2e" stroke="#4db6ac" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="65" rx="8" fill="none" stroke="#4db6ac" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <text x="15" y="22" font-family="monospace" font-size="11" fill="#4db6ac" font-weight="bold">CAREGIVER HUB</text>
      <text x="15" y="40" font-family="-apple-system, sans-serif" font-size="9" fill="#6a6a8a">Family support network</text>
      <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#4a8a6a">Progress sharing</text>
    </g>
  </g>

  <!-- Bottom status -->
  <g transform="translate(50, 385)">
    <rect x="0" y="0" width="600" height="25" rx="12" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1"/>
    <text x="20" y="17" font-family="monospace" font-size="10" fill="#9575cd">▸ Student Conference on Self-Reliant India</text>
    <text x="540" y="17" font-family="-apple-system, sans-serif" font-size="10" fill="#d4a373" text-anchor="end">
      <tspan fill="#d4a373">★</tspan> Best Paper
    </text>
  </g>

  <!-- Corner accents -->
  <g>
    <circle cx="20" cy="395" r="4" fill="#9575cd" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="395" r="4" fill="#ff8a65" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>
