<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <!-- Warm editorial palette -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    
    <!-- Subtle accent gradients -->
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    
    <linearGradient id="sageAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#81b29a"/>
      <stop offset="100%" stop-color="#9fc5a6"/>
    </linearGradient>
    
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.06"/>
    </filter>
    
    <!-- Elegant glow for accent elements -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Warm background -->
  <rect width="600" height="340" fill="url(#warmBg)" rx="12"/>

  <!-- Subtle paper texture -->
  <g fill="#e8e4df" opacity="0.3">
    <circle cx="50" cy="50" r="1"/>
    <circle cx="150" cy="80" r="1"/>
    <circle cx="250" cy="30" r="1"/>
    <circle cx="350" cy="70" r="1"/>
    <circle cx="450" cy="40" r="1"/>
    <circle cx="550" cy="60" r="1"/>
    <circle cx="100" cy="300" r="1"/>
    <circle cx="300" cy="320" r="1"/>
    <circle cx="500" cy="290" r="1"/>
  </g>

  <!-- Audio waveform animation area -->
  <g transform="translate(30, 25)">
    <text x="0" y="15" font-family="Georgia, serif" font-size="10" fill="#8a8a8a" letter-spacing="1">TRANSCRIBING</text>
    
    <!-- Animated waveform bars -->
    <g transform="translate(0, 25)">
      <rect x="0" y="8" width="3" height="16" rx="1.5" fill="#e07a5f" opacity="0.7">
        <animate attributeName="height" values="8;20;12;16;8;20;16;12" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;0;10;8;12;0;8;10" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="7" y="5" width="3" height="22" rx="1.5" fill="#e07a5f" opacity="0.8">
        <animate attributeName="height" values="16;8;20;12;16;8;12;20" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;12;6;10;8;12;10;6" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="14" y="3" width="3" height="26" rx="1.5" fill="#e07a5f" opacity="0.9">
        <animate attributeName="height" values="12;24;18;20;12;24;20;18" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;0;7;6;10;0;6;7" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="21" y="6" width="3" height="20" rx="1.5" fill="#e07a5f" opacity="0.75">
        <animate attributeName="height" values="20;10;24;14;20;10;14;24" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;12;4;9;6;12;9;4" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="2" width="3" height="28" rx="1.5" fill="#e07a5f" opacity="0.85">
        <animate attributeName="height" values="14;26;18;22;14;26;22;18" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="9;0;8;5;9;0;5;8" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="35" y="4" width="3" height="24" rx="1.5" fill="#e07a5f" opacity="0.7">
        <animate attributeName="height" values="18;12;22;16;18;12;16;22" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="7;10;5;8;7;10;8;5" dur="0.7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Pipeline flow - elegant arrows -->
  <g transform="translate(30, 90)">
    <line x1="60" y1="20" x2="140" y2="20" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="60" cy="20" r="4" fill="url(#coralAccent)">
      <animate attributeName="cx" values="60;130" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <line x1="220" y1="20" x2="300" y2="20" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="220" cy="20" r="4" fill="url(#sageAccent)">
      <animate attributeName="cx" values="220;290" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    
    <line x1="380" y1="20" x2="460" y2="20" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="380" cy="20" r="4" fill="url(#goldAccent)">
      <animate attributeName="cx" values="380;450" dur="2s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
  </g>

  <!-- Node 1: Whisper -->
  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="white" stroke="#e07a5f" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="65" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">Whisper</text>
    <text x="65" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Transcription</text>
  </g>

  <!-- Node 2: Gemini -->
  <g transform="translate(195, 115)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="white" stroke="#81b29a" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="65" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">Gemini</text>
    <text x="65" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">AI Extraction</text>
  </g>

  <!-- Node 3: Supabase -->
  <g transform="translate(360, 115)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="white" stroke="#d4a373" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="65" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">Supabase</text>
    <text x="65" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Storage</text>
  </g>

  <!-- Output section -->
  <g transform="translate(30, 185)">
    <!-- Decisions card -->
    <g>
      <rect x="0" y="0" width="170" height="70" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="70" rx="2" fill="url(#coralAccent)"/>
      <text x="15" y="20" font-family="Georgia, serif" font-size="10" fill="#e07a5f" font-weight="600">Decisions</text>
      <text x="15" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#4a4a4a">Q3 Launch: Sept 15</text>
      <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#4a4a4a">Stack: React + Supabase</text>
    </g>

    <!-- Action items card -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="170" height="70" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="70" rx="2" fill="url(#sageAccent)"/>
      <text x="15" y="20" font-family="Georgia, serif" font-size="10" fill="#81b29a" font-weight="600">Action Items</text>
      <text x="15" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#4a4a4a">Ship auth feature [P1]</text>
      <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#4a4a4a">Build dashboard [P1]</text>
    </g>

    <!-- Risk flags card -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="170" height="70" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="70" rx="2" fill="url(#goldAccent)"/>
      <text x="15" y="20" font-family="Georgia, serif" font-size="10" fill="#d4a373" font-weight="600">Risk Flags</text>
      <text x="15" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#4a4a4a">3 tasks due same day</text>
      <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#81b29a">No blockers</text>
    </g>
  </g>

  <!-- Progress bar - elegant style -->
  <g transform="translate(30, 275)">
    <rect x="0" y="0" width="540" height="45" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
    
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#4a4a4a">momentum process meeting.mp3</text>
    
    <!-- Progress indicator -->
    <rect x="280" y="18" width="200" height="8" rx="4" fill="#f5f2ed"/>
    <rect x="280" y="18" width="200" height="8" rx="4" fill="none" stroke="#e8e4df" stroke-width="0.5"/>
    <rect x="282" y="20" width="0" height="4" rx="2" fill="url(#coralAccent)">
      <animate attributeName="width" values="0;196" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <text x="495" y="27" font-family="-apple-system, sans-serif" font-size="10" fill="#e07a5f" font-weight="500">
      <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
      Done
    </text>
  </g>

  <!-- Title footer -->
  <text x="300" y="332" font-family="Georgia, serif" font-size="10" fill="#8a8a8a" text-anchor="middle" letter-spacing="0.5">Momentum AI — Meeting Intelligence in 48 Hours</text>
</svg>
