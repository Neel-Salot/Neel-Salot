<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <!-- Glowing effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad)" rx="12"/>

  <!-- Animated grid lines -->
  <g stroke="#1e1e3e" stroke-width="0.5">
    <line x1="0" y1="60" x2="600" y2="60">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- Audio waveform animation -->
  <g transform="translate(30, 30)">
    <text x="0" y="12" font-family="monospace" font-size="9" fill="#4a4a6a" letter-spacing="1">◉ TRANSCRIBING AUDIO</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="15" width="4" height="20" rx="2" fill="#00d4ff" opacity="0.8">
        <animate attributeName="height" values="10;25;15;20;10;25;20;15" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;10;17;15;20;10;15;17" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="8" y="10" width="4" height="30" rx="2" fill="#00d4ff" opacity="0.7">
        <animate attributeName="height" values="20;10;25;15;20;10;15;25" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="15;25;10;20;15;25;20;10" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="8" width="4" height="34" rx="2" fill="#00d4ff" opacity="0.9">
        <animate attributeName="height" values="15;30;20;25;15;30;25;20" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="17;7;15;12;17;7;12;15" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="12" width="4" height="26" rx="2" fill="#00d4ff" opacity="0.6">
        <animate attributeName="height" values="25;12;30;18;25;12;18;30" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;23;10;16;12;23;16;10" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="32" y="5" width="4" height="40" rx="2" fill="#00d4ff" opacity="0.8">
        <animate attributeName="height" values="18;35;22;30;18;35;30;22" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="16;7;14;10;16;7;10;14" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="10" width="4" height="30" rx="2" fill="#00d4ff" opacity="0.7">
        <animate attributeName="height" values="22;15;28;20;22;15;20;28" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="14;17;11;15;14;17;15;11" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="13" width="4" height="24" rx="2" fill="#00d4ff" opacity="0.6">
        <animate attributeName="height" values="30;18;25;22;30;18;22;25" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;16;12;14;10;16;14;12" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="56" y="7" width="4" height="36" rx="2" fill="#00d4ff" opacity="0.9">
        <animate attributeName="height" values="20;32;25;28;20;32;28;25" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="15;9;12;11;15;9;11;12" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="64" y="11" width="4" height="28" rx="2" fill="#00d4ff" opacity="0.7">
        <animate attributeName="height" values="28;20;18;30;28;20;30;18" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="11;15;16;10;11;15;10;16" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="9" width="4" height="32" rx="2" fill="#00d4ff" opacity="0.8">
        <animate attributeName="height" values="15;28;22;25;15;28;25;22" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="17;11;14;12;17;11;12;14" dur="0.7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Flow arrows - animated -->
  <g transform="translate(30, 85)">
    <path d="M0,10 L80,10" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="6,4" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="80,6 90,10 80,14" fill="#00d4ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- WHISPER NODE -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#0a0a1a" stroke="#00d4ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="45" rx="6" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="20" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">WHISPER</text>
    <text x="60" y="35" font-family="monospace" font-size="8" fill="#4a6a8a" text-anchor="middle">Transcription</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(155, 115)">
    <path d="M0,15 L40,15" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <polygon points="40,11 50,15 40,19" fill="#a855f7" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.8s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- GEMINI NODE -->
  <g transform="translate(200, 100)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#0a0a1a" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="45" rx="6" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <text x="60" y="20" font-family="monospace" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="bold">GEMINI</text>
    <text x="60" y="35" font-family="monospace" font-size="8" fill="#6a4a8a" text-anchor="middle">AI Extraction</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(325, 115)">
    <path d="M0,15 L40,15" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <polygon points="40,11 50,15 40,19" fill="#22c55e" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.6s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- SUPABASE NODE -->
  <g transform="translate(370, 100)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#0a0a1a" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="45" rx="6" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <text x="60" y="20" font-family="monospace" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="bold">SUPABASE</text>
    <text x="60" y="35" font-family="monospace" font-size="8" fill="#4a6a5a" text-anchor="middle">Storage</text>
  </g>

  <!-- Arrow to output -->
  <g transform="translate(200, 155)">
    <path d="M0,15 L120,15" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <polygon points="120,11 130,15 120,19" fill="#fbbf24" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.7s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- OUTPUT CARDS - animated appearance -->
  <g transform="translate(30, 175)">
    <!-- Decision card -->
    <rect x="0" y="0" width="165" height="50" rx="4" fill="#0a0a1a" stroke="#a855f7" stroke-width="1" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="10" y="18" font-family="monospace" font-size="9" fill="#a855f7" font-weight="bold">DECISIONS</text>
    <text x="10" y="32" font-family="monospace" font-size="8" fill="#6a6a8a">▸ Q3 launch: Sept 15</text>
    <text x="10" y="44" font-family="monospace" font-size="8" fill="#6a6a8a">▸ Stack: React + Supabase</text>

    <!-- Action items card -->
    <rect x="175" y="0" width="165" height="50" rx="4" fill="#0a0a1a" stroke="#00d4ff" stroke-width="1" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <text x="185" y="18" font-family="monospace" font-size="9" fill="#00d4ff" font-weight="bold">ACTION ITEMS</text>
    <text x="185" y="32" font-family="monospace" font-size="8" fill="#6a6a8a">▸ @neel — Ship auth [P1]</text>
    <text x="185" y="44" font-family="monospace" font-size="8" fill="#6a6a8a">▸ @yugam — Dashboard [P1]</text>

    <!-- Risk card -->
    <rect x="350" y="0" width="165" height="50" rx="4" fill="#0a0a1a" stroke="#fbbf24" stroke-width="1" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <text x="360" y="18" font-family="monospace" font-size="9" fill="#fbbf24" font-weight="bold">RISK FLAGS</text>
    <text x="360" y="32" font-family="monospace" font-size="8" fill="#6a6a8a">⚠ 3 tasks due same day</text>
    <text x="360" y="44" font-family="monospace" font-size="8" fill="#4a8a5a">✓ No blockers</text>
  </g>

  <!-- Bottom status bar -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="540" height="40" rx="6" fill="#0a0a1a" stroke="#1e1e3e" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="10" fill="#4a6a5a">$ momentum process meeting.mp3</text>

    <!-- Progress bar animation -->
    <rect x="250" y="18" width="200" height="8" rx="4" fill="#1a1a2a"/>
    <rect x="250" y="18" width="200" height="8" rx="4" fill="none" stroke="#2a2a4a" stroke-width="1"/>
    <rect x="252" y="20" width="0" height="4" rx="2" fill="url(#cyanGrad)">
      <animate attributeName="width" values="0;196" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Percentage -->
    <text x="460" y="25" font-family="monospace" font-size="9" fill="#00d4ff">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      100%
    </text>
  </g>

  <!-- Title -->
  <text x="300" y="328" font-family="monospace" font-size="10" fill="#3a3a5a" text-anchor="middle">MOMENTUM AI — Meeting Intelligence in 48 hours</text>

  <!-- Corner decorations -->
  <circle cx="15" cy="325" r="3" fill="#22c55e" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="585" cy="325" r="3" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>
