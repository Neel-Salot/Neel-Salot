<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <style>
    .section-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 24px;
      font-weight: 900;
      fill: #000000;
      letter-spacing: 1px;
    }
    .category-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 900;
      fill: #000000;
    }
    .skill-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      font-weight: bold;
      fill: #000000;
    }
  </style>

  <!-- Outer Shadow -->
  <rect x="12" y="12" width="776" height="236" rx="6" fill="#000000" />

  <!-- Outer Card Body -->
  <rect x="4" y="4" width="776" height="236" rx="6" fill="#00E5FF" stroke="#000000" stroke-width="4" />

  <!-- Section Title -->
  <text x="30" y="42" class="section-title">// TECHNICAL SKILLS</text>

  <!-- FRONTEND -->
  <g transform="translate(35, 68)">
    <!-- Shadow -->
    <rect x="4" y="4" width="355" height="74" rx="2" fill="#000000" />
    <!-- Box -->
    <rect x="0" y="0" width="355" height="74" rx="2" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[FRONTEND]</text>
    <line x1="15" y1="33" x2="340" y2="33" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="15" y="52" class="skill-text">React · TypeScript · TailwindCSS · HTML5 · CSS3</text>
  </g>

  <!-- BACKEND & APIs -->
  <g transform="translate(410, 68)">
    <!-- Shadow -->
    <rect x="4" y="4" width="355" height="74" rx="2" fill="#000000" />
    <!-- Box -->
    <rect x="0" y="0" width="355" height="74" rx="2" fill="#00FF66" stroke="#000000" stroke-width="2.5" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[BACKEND &amp; APIs]</text>
    <line x1="15" y1="33" x2="340" y2="33" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="15" y="52" class="skill-text">Node.js (Express) · Python (Django/FastAPI) · PHP · .NET</text>
  </g>

  <!-- DATA STORAGE -->
  <g transform="translate(35, 154)">
    <!-- Shadow -->
    <rect x="4" y="4" width="355" height="74" rx="2" fill="#000000" />
    <!-- Box -->
    <rect x="0" y="0" width="355" height="74" rx="2" fill="#FF55BB" stroke="#000000" stroke-width="2.5" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[DATABASES]</text>
    <line x1="15" y1="33" x2="340" y2="33" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="15" y="52" class="skill-text">Supabase (PostgreSQL) · Firebase · MySQL · SQLite</text>
  </g>

  <!-- INTELLIGENCE & INFRA -->
  <g transform="translate(410, 154)">
    <!-- Shadow -->
    <rect x="4" y="4" width="355" height="74" rx="2" fill="#000000" />
    <!-- Box -->
    <rect x="0" y="0" width="355" height="74" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[AI &amp; TOOLS]</text>
    <line x1="15" y1="33" x2="340" y2="33" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="15" y="52" class="skill-text">Agentic pipelines · Gemini API · Whisper · Docker · Git</text>
  </g>
</svg>
