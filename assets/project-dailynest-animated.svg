<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <!-- Warm editorial palette -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    
    <!-- Accent colors - warm and caring palette -->
    <linearGradient id="lavenderAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9575cd"/>
      <stop offset="100%" stop-color="#b39ddb"/>
    </linearGradient>
    
    <linearGradient id="coralWarmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#ffab91"/>
    </linearGradient>
    
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#80cbc4"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Warm background -->
  <rect width="600" height="340" fill="url(#warmBg)" rx="12"/>

  <!-- Subtle paper texture -->
  <g fill="#e8e4df" opacity="0.3">
    <circle cx="50" cy="50" r="1"/>
    <circle cx="150" cy="80" r="1"/>
    <circle cx="250" cy="30" r="1"/>
    <circle cx="350" cy="70" r="1"/>
    <circle cx="450" cy="40" r="1"/>
    <circle cx="550" cy="60" r="1"/>
    <circle cx="100" cy="300" r="1"/>
    <circle cx="300" cy="320" r="1"/>
    <circle cx="500" cy="290" r="1"/>
  </g>

  <!-- AI Brain pattern detection area -->
  <g transform="translate(30, 25)">
    <text x="0" y="15" font-family="Georgia, serif" font-size="10" fill="#8a8a8a" letter-spacing="1">PATTERN ANALYSIS</text>
    
    <!-- Animated neural network nodes -->
    <g transform="translate(10, 35)">
      <!-- Central node -->
      <circle cx="50" cy="30" r="12" fill="white" stroke="url(#lavenderAccent)" stroke-width="2"/>
      <circle cx="50" cy="30" r="6" fill="#b39ddb">
        <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#b39ddb;#9575cd;#b39ddb" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Surrounding nodes with pulsing animation -->
      <g stroke="#d4d4d4" stroke-width="1">
        <line x1="50" y1="18" x2="50" y2="10"/>
        <circle cx="50" cy="8" r="4" fill="#ff8a65">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        
        <line x1="58" y1="26" x2="66" y2="22"/>
        <circle cx="68" cy="20" r="4" fill="#4db6ac">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
        </circle>
        
        <line x1="42" y1="26" x2="34" y2="22"/>
        <circle cx="32" cy="20" r="4" fill="#b39ddb">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
        </circle>
        
        <line x1="58" y1="34" x2="66" y2="38"/>
        <circle cx="68" cy="40" r="4" fill="#ff8a65">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
        </circle>
        
        <line x1="42" y1="34" x2="34" y2="38"/>
        <circle cx="32" cy="40" r="4" fill="#4db6ac">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
        </circle>
      </g>
    </g>
    
    <!-- Stress level indicator -->
    <g transform="translate(100, 35)">
      <rect x="0" y="0" width="70" height="25" rx="4" fill="white" stroke="#e8e4df" stroke-width="1"/>
      <text x="15" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#4a4a4a">Stress:</text>
      <rect x="40" y="8" width="20" height="8" rx="4" fill="#ff8a65" opacity="0.3"/>
      <rect x="40" y="8" width="8" height="8" rx="4" fill="#4db6ac">
        <animate attributeName="width" values="8;12;8" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Module flow -->
  <g transform="translate(30, 100)">
    <!-- Flow arrows -->
    <line x1="100" y1="25" x2="160" y2="25" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="100" cy="25" r="3" fill="url(#lavenderAccent)">
      <animate attributeName="cx" values="100;150" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <line x1="280" y1="25" x2="340" y2="25" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="280" cy="25" r="3" fill="url(#coralWarmAccent)">
      <animate attributeName="cx" values="280;330" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
  </g>

  <!-- Platform nodes -->
  <g transform="translate(30, 130)">
    <!-- CNN node -->
    <rect x="0" y="0" width="140" height="50" rx="8" fill="white" stroke="#9575cd" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="70" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">CNN</text>
    <text x="70" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Pattern Detection</text>
  </g>

  <!-- ML node -->
  <g transform="translate(200, 130)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="white" stroke="#ff8a65" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="70" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">ML Engine</text>
    <text x="70" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Stress Analysis</text>
  </g>

  <!-- NLP node -->
  <g transform="translate(370, 130)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="white" stroke="#4db6ac" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="70" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">NLP</text>
    <text x="70" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Sentiment</text>
  </g>

  <!-- Support modules -->
  <g transform="translate(30, 200)">
    <text x="0" y="15" font-family="Georgia, serif" font-size="11" fill="#4a4a4a">Support Modules</text>
    
    <!-- Module cards -->
    <g>
      <rect x="0" y="25" width="165" height="55" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="25" width="4" height="55" rx="2" fill="url(#lavenderAccent)"/>
      <text x="15" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#9575cd" font-weight="500">Daily Journal</text>
      <text x="15" y="62" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a">Track emotions</text>
    </g>

    <g>
      <rect x="180" y="25" width="165" height="55" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="180" y="25" width="4" height="55" rx="2" fill="url(#coralWarmAccent)"/>
      <text x="195" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#ff8a65" font-weight="500">Trigger Alerts</text>
      <text x="195" y="62" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a">Pattern detection</text>
    </g>

    <g>
      <rect x="360" y="25" width="165" height="55" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="360" y="25" width="4" height="55" rx="2" fill="url(#mintAccent)"/>
      <text x="375" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#4db6ac" font-weight="500">Caregiver Hub</text>
      <text x="375" y="62" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a">Family support</text>
    </g>
  </g>

  <!-- Award badge -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="540" height="35" rx="6" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
    
    <circle cx="25" cy="17" r="8" fill="#d4a373" opacity="0.2"/>
    <text x="25" y="21" font-family="-apple-system, sans-serif" font-size="8" fill="#d4a373" text-anchor="middle" font-weight="600">★</text>
    
    <text x="50" y="21" font-family="-apple-system, sans-serif" font-size="11" fill="#4a4a4a">Best Research Paper Award — Student Conference on Self-Reliant India</text>
    
    <text x="510" y="21" font-family="Georgia, serif" font-size="10" fill="#81b29a" text-anchor="end">
      <tspan fill="#d4a373">●</tspan> Published
    </text>
  </g>

  <!-- Title footer -->
  <text x="300" y="332" font-family="Georgia, serif" font-size="10" fill="#8a8a8a" text-anchor="middle" letter-spacing="0.5">DailyNest — AI-Powered Autism Support</text>
</svg>
