<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad3)" rx="12"/>

  <!-- Animated background circles -->
  <circle cx="300" cy="100" r="80" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.1">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="100" r="60" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="60;75;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="100" r="40" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="40;50;40" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Central AI brain -->
  <g transform="translate(260, 50)">
    <animateTransform attributeName="transform" type="translate" values="260,50;260,47;260,50" dur="3s" repeatCount="indefinite"/>
    <circle cx="40" cy="50" r="25" fill="#0a0a1a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="40" cy="50" r="25" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="25;30;25" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Brain pattern inside -->
    <g stroke="#22c55e" stroke-width="1" fill="none" opacity="0.6">
      <path d="M30,40 Q40,35 50,40">
        <animate attributeName="d" values="M30,40 Q40,35 50,40;M30,40 Q40,30 50,40;M30,40 Q40,35 50,40" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M30,50 Q40,55 50,50">
        <animate attributeName="d" values="M30,50 Q40,55 50,50;M30,50 Q40,60 50,50;M30,50 Q40,55 50,50" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M35,45 L45,45"/>
      <circle cx="35" cy="45" r="3" fill="#22c55e" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="45" cy="45" r="3" fill="#22c55e" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="40" cy="45" r="3" fill="#22c55e" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite" begin="0.25s"/>
      </circle>
    </g>
  </g>

  <!-- AI PULSE label -->
  <text x="300" y="130" font-family="monospace" font-size="9" fill="#22c55e" text-anchor="middle" letter-spacing="2">
    ◉ AI PATTERN DETECTION ACTIVE
  </text>

  <!-- Four module nodes -->
  <g transform="translate(30, 150)">
    <!-- Day Planner -->
    <g>
      <rect x="0" y="0" width="120" height="50" rx="6" fill="#0a0a1a" stroke="#50fa7b" stroke-width="1.5" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="60" y="20" font-family="monospace" font-size="10" fill="#50fa7b" text-anchor="middle" font-weight="bold">DAY PLANNER</text>
      <text x="60" y="36" font-family="monospace" font-size="8" fill="#5a7a6a" text-anchor="middle">Visual routine builder</text>
    </g>

    <!-- Emotion Tracker -->
    <g transform="translate(130, 0)">
      <rect x="0" y="0" width="120" height="50" rx="6" fill="#0a0a1a" stroke="#a855f7" stroke-width="1.5" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <text x="60" y="20" font-family="monospace" font-size="10" fill="#a855f7" text-anchor="middle" font-weight="bold">EMOTION</text>
      <text x="60" y="36" font-family="monospace" font-size="8" fill="#6a5a8a" text-anchor="middle">Regulation support</text>
    </g>

    <!-- Communication Assistant -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="140" height="50" rx="6" fill="#0a0a1a" stroke="#ff6b9d" stroke-width="1.5" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <text x="70" y="20" font-family="monospace" font-size="10" fill="#ff6b9d" text-anchor="middle" font-weight="bold">COMM ASST</text>
      <text x="70" y="36" font-family="monospace" font-size="8" fill="#8a5a6a" text-anchor="middle">Communication support</text>
    </g>

    <!-- Caregiver Dashboard -->
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="140" height="50" rx="6" fill="#0a0a1a" stroke="#fbbf24" stroke-width="1.5" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" begin="0.9s"/>
      </rect>
      <text x="70" y="20" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">CAREGIVER</text>
      <text x="70" y="36" font-family="monospace" font-size="8" fill="#7a6a5a" text-anchor="middle">Analytics dashboard</text>
    </g>
  </g>

  <!-- Connection lines from AI to modules -->
  <g stroke="#22c55e" stroke-width="1" fill="none" opacity="0.3">
    <line x1="300" y1="125" x2="90" y2="175">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="125" x2="190" y2="175">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="300" y1="125" x2="330" y2="175">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    <line x1="300" y1="125" x2="480" y2="175">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </line>
  </g>

  <!-- Stress pattern chart -->
  <g transform="translate(30, 220)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#3a3a5a" letter-spacing="1">// STRESS TRIGGER PATTERN DETECTION</text>

    <rect x="0" y="10" width="540" height="45" rx="6" fill="#0a0a1a" stroke="#2a2a4a" stroke-width="1"/>

    <!-- Animated wave pattern -->
    <polyline points="10,45 50,45 70,30 90,50 110,35 130,45 150,30 170,50 190,35 210,45 230,30 250,50 270,35 290,45 310,30 330,50 350,35 370,45 390,30 410,50 430,35 450,45 470,30 490,50 510,35 530,45"
      fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6">
      <animate attributeName="points"
        values="10,45 50,45 70,30 90,50 110,35 130,45 150,30 170,50 190,35 210,45 230,30 250,50 270,35 290,45 310,30 330,50 350,35 370,45 390,30 410,50 430,35 450,45 470,30 490,50 510,35 530,45;
               10,45 50,30 70,45 90,35 110,50 130,35 150,45 170,30 190,50 210,35 230,45 250,30 270,50 290,35 310,45 330,30 350,50 370,35 390,45 410,30 430,50 450,35 470,45 490,30 510,50 530,35;
               10,45 50,45 70,30 90,50 110,35 130,45 150,30 170,50 190,35 210,45 230,30 250,50 270,35 290,45 310,30 330,50 350,35 370,45 390,30 410,50 430,35 450,45 470,30 490,50 510,35 530,45"
        dur="4s" repeatCount="indefinite"/>
    </polyline>

    <!-- Alert dot - pulsing -->
    <circle cx="330" cy="35" r="5" fill="#ff6b9d" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Alert label -->
    <text x="340" y="38" font-family="monospace" font-size="8" fill="#ff6b9d">⚠ PATTERN DETECTED</text>
  </g>

  <!-- Award badge -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="200" height="45" rx="6" fill="#0a0a1a" stroke="#fbbf24" stroke-width="1.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="18" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">★ BEST RESEARCH PAPER</text>
    <text x="100" y="32" font-family="monospace" font-size="8" fill="#7a6a4a" text-anchor="middle">Student Conf on Self-Reliant India</text>
  </g>

  <!-- Stack info -->
  <g transform="translate(240, 280)">
    <rect x="0" y="0" width="330" height="45" rx="6" fill="#0a0a1a" stroke="#2a2a4a" stroke-width="1"/>
    <text x="165" y="18" font-family="monospace" font-size="9" fill="#5a5a7a" text-anchor="middle">Python · Django · CNN · ML · NLP</text>
    <text x="165" y="35" font-family="monospace" font-size="8" fill="#4a4a5a" text-anchor="middle">AI-powered pattern detection · Stress trigger identification · Proactive interventions</text>
  </g>

  <!-- Title -->
  <text x="300" y="328" font-family="monospace" font-size="10" fill="#3a3a5a" text-anchor="middle">DAILYNEST — AI Autism Support Platform</text>

  <!-- Corner decorations -->
  <circle cx="15" cy="325" r="3" fill="#50fa7b" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="585" cy="325" r="3" fill="#fbbf24" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>
