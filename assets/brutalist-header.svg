<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%">
  <style>
    .title {
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      font-size: 52px;
      font-weight: 900;
      fill: #000000;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #000000;
      letter-spacing: 1px;
    }
    .bio {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      fill: #111111;
    }
    .badge-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      fill: #000000;
    }
  </style>

  <!-- Solid Shadow (Offset) -->
  <rect x="12" y="12" width="776" height="206" rx="6" fill="#000000" />

  <!-- Main Card Body -->
  <rect x="4" y="4" width="776" height="206" rx="6" fill="#FFE600" stroke="#000000" stroke-width="4" />

  <!-- Diagonal Stripe Accent in top right -->
  <path d="M 680 4 L 780 104 L 780 4 Z" fill="#00E5FF" stroke="#000000" stroke-width="4" />

  <!-- Name -->
  <text x="30" y="75" class="title">NEEL SALOT</text>

  <!-- Taglines -->
  <text x="30" y="115" class="subtitle">FULL STACK DEVELOPER // AI BUILDER // SYSTEMS THINKER</text>

  <!-- Rotated Location Sticker -->
  <g transform="translate(620, 25) rotate(-3)">
    <!-- Shadow -->
    <rect x="4" y="4" width="130" height="26" fill="#000000" />
    <!-- Sticker Card -->
    <rect x="0" y="0" width="130" height="26" fill="#FF007F" stroke="#000000" stroke-width="2" />
    <text x="65" y="17" class="badge-text" text-anchor="middle" fill="#FFFFFF">SURAT, GUJARAT, IN</text>
  </g>

  <!-- Horizontal divider -->
  <line x1="30" y1="135" x2="650" y2="135" stroke="#000000" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Bio Lines -->
  <text x="30" y="160" class="bio">Final-year B.Sc. IT student (CGPA 9.46) who builds structural software.</text>
  <text x="30" y="180" class="bio">Comfortable cross-stack, from React interfaces to serverless agent pipelines.</text>

  <!-- Core Status Badge (Bottom Right) -->
  <g transform="translate(605, 155)">
    <!-- Shadow -->
    <rect x="4" y="4" width="160" height="30" rx="3" fill="#000000" />
    <!-- Status Body -->
    <rect x="0" y="0" width="160" height="30" rx="3" fill="#00FF66" stroke="#000000" stroke-width="2" />
    <!-- Pulse dot -->
    <circle cx="20" cy="15" r="5" fill="#000000">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="19" class="badge-text" font-weight="900">CORE STATUS: OK</text>
  </g>
</svg>
