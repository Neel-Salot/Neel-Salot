        <text x="25" y="53" font-family="'Courier New', monospace" font-size="9" fill="#00ffc4" font-weight="bold">ONLINE</text>
        
        <text x="120" y="20" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">Req: 50</text>
        <text x="120" y="53" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">14ms</text>
      </g>
    
    
      <!-- Node Box: momentum -->
