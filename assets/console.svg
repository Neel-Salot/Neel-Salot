        <rect width="130" height="72" rx="8" fill="#0c101d" fill-opacity="0.9" stroke="#00ffc4" stroke-width="1.5" />
        <text x="10" y="20" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#e1e4e8">MOMENTUM_AI</text>
        <text x="10" y="33" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">Whisper/Gemini Build</text>
        
        <circle cx="15" cy="50" r="3.5" fill="#00ffc4">
          
          
        </circle>
        <text x="25" y="53" font-family="'Courier New', monospace" font-size="9" fill="#00ffc4" font-weight="bold">ONLINE</text>
        
        <text x="120" y="20" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">Req: 21</text>
        <text x="120" y="53" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">22ms</text>
