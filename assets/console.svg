    <text x="20" y="30" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#e1e4e8">AGENT ARCHITECTURE TOPOLOGY</text>
    <text x="20" y="45" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">INTELLIGENT LOAD BALANCER ACTIVE</text>

