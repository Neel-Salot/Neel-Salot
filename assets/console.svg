        <animate attributeName="stroke-dashoffset" values="100;0" dur="4s" repeatCount="indefinite" />
      </line>
    
    
      <line x1="270" y1="200" x2="100" y2="330" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 8" />
      <line x1="270" y1="200" x2="100" y2="330" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" opacity="0.3" stroke-dasharray="8 25">
        <animate attributeName="stroke-dashoffset" values="100;0" dur="4s" repeatCount="indefinite" />
      </line>
    
    
      <line x1="270" y1="200" x2="440" y2="330" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 8" />
      <line x1="270" y1="200" x2="440" y2="330" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" opacity="0.3" stroke-dasharray="8 25">
        <animate attributeName="stroke-dashoffset" values="100;0" dur="4s" repeatCount="indefinite" />
      </line>
    

    <!-- Interactive Node Elements -->
    
      <!-- Node Box: core -->
