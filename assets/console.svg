        <text x="10" y="20" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#e1e4e8">KAIRO_AI</text>
        <text x="10" y="33" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">Sign Language Platform</text>
        
        <circle cx="15" cy="50" r="3.5" fill="#00ffc4">
          
          
        </circle>
        <text x="25" y="53" font-family="'Courier New', monospace" font-size="9" fill="#00ffc4" font-weight="bold">ONLINE</text>
        
        <text x="120" y="20" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">Req: 15</text>
        <text x="120" y="53" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">30ms</text>
      </g>
    
    
      <!-- Node Box: dailynest -->
      <g transform="translate(35, 294)">
        <rect width="130" height="72" rx="8" fill="#0c101d" fill-opacity="0.9" stroke="#00ffc4" stroke-width="1.5" />
        <text x="10" y="20" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#e1e4e8">DAILY_NEST</text>
        <text x="10" y="33" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">Autism Support Platform</text>
        
        <circle cx="15" cy="50" r="3.5" fill="#00ffc4">
          
          
        </circle>
        <text x="25" y="53" font-family="'Courier New', monospace" font-size="9" fill="#00ffc4" font-weight="bold">ONLINE</text>
        
        <text x="120" y="20" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">Req: 18</text>
        <text x="120" y="53" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">19ms</text>
      </g>
    
    
      <!-- Node Box: flexigrow -->
      <g transform="translate(375, 294)">
        <rect width="130" height="72" rx="8" fill="#0c101d" fill-opacity="0.9" stroke="#00ffc4" stroke-width="1.5" />
        <text x="10" y="20" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#e1e4e8">FLEXI_GROW</text>
        <text x="10" y="33" font-family="'Courier New', monospace" font-size="9" fill="#8b949e">Hydroponics Telemetry</text>
        
        <circle cx="15" cy="50" r="3.5" fill="#00ffc4">
          
          
        </circle>
        <text x="25" y="53" font-family="'Courier New', monospace" font-size="9" fill="#00ffc4" font-weight="bold">ONLINE</text>
        
        <text x="120" y="20" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">Req: 12</text>
        <text x="120" y="53" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" text-anchor="end">15ms</text>
      </g>
    
