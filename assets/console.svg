    <!-- Momentum AI: (100, 70) -->
    <!-- Kairo AI: (440, 70) -->
    <!-- DailyNest: (100, 330) -->
    <!-- FlexiGrow: (440, 330) -->
    
      <line x1="270" y1="200" x2="100" y2="70" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 8" />
