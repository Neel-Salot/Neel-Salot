<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <!-- Vibrant gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#0f1628"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animated path for particle to follow -->
    <path id="orbitPath" d="M 450 160 m -120 0 a 120 50 0 1 1 240 0 a 120 50 0 1 1 -240 0" fill="none"/>
    <path id="orbitPath2" d="M 450 160 m -80 0 a 80 35 0 1 1 160 0 a 80 35 0 1 1 -160 0" fill="none"/>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FLOATING STARS                                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  
  <circle cx="50" cy="50" r="1.5" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="80" r="1" fill="#00d4ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="30" r="1.5" fill="#ff6b9d" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="60" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="500" cy="25" r="1.5" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="55" r="1" fill="#fbbf24" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="35" r="1.5" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="70" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="850" cy="45" r="1.5" fill="#ff6b9d" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- More stars bottom -->
  <circle cx="80" cy="280" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="300" r="1.5" fill="#00d4ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="290" r="1" fill="#a855f7" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="300" r="1.5" fill="#ff6b9d" opacity="0.6"/>
  <circle cx="700" cy="285" r="1" fill="#fbbf24" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="295" r="1" fill="#fff" opacity="0.7"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ORBITAL RINGS                                        -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Outer orbital ring -->
  <ellipse cx="450" cy="160" rx="130" ry="55" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="0 450 160" to="360 450 160" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Middle orbital ring -->
  <ellipse cx="450" cy="160" rx="100" ry="42" fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="360 450 160" to="0 450 160" dur="15s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Inner glow ring -->
  <ellipse cx="450" cy="160" rx="80" ry="32" fill="none" stroke="#ff6b9d" stroke-width="0.5" opacity="0.2" stroke-dasharray="5,10">
    <animateTransform attributeName="transform" type="rotate" from="0 450 160" to="360 450 160" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FLOATING ANIMATED PARTICLES                          -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Particle 1 - pink -->
  <circle cx="0" cy="0" r="4" fill="#ff6b9d" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#orbitPath"/>
    </animateMotion>
  </circle>

  <!-- Particle 2 - cyan -->
  <circle cx="0" cy="0" r="3" fill="#00d4ff" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0.5s">
      <mpath href="#orbitPath2"/>
    </animateMotion>
  </circle>

  <!-- Particle 3 - yellow -->
  <circle cx="0" cy="0" r="3" fill="#fbbf24" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" begin="1s">
      <mpath href="#orbitPath"/>
    </animateMotion>
  </circle>

  <!-- Particle 4 - purple -->
  <circle cx="0" cy="0" r="2.5" fill="#a855f7" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="1.5s">
      <mpath href="#orbitPath2"/>
    </animateMotion>
  </circle>

  <!-- Floating squares - fun element -->
  <rect x="0" y="0" width="8" height="8" fill="none" stroke="#ff6b9d" stroke-width="1.5" transform="rotate(45)" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" begin="0.3s">
      <mpath href="#orbitPath"/>
    </animateMotion>
  </rect>

  <rect x="0" y="0" width="6" height="6" fill="none" stroke="#00d4ff" stroke-width="1" transform="rotate(30)" filter="url(#softGlow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#orbitPath2"/>
    </animateMotion>
  </rect>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FLOATING SHAPES - OFF-ORBIT                        -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Floating triangle left -->
  <polygon points="100,160 115,180 85,180" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 100 170; 10 100 170; 0 100 170" dur="3s" repeatCount="indefinite" additive="sum"/>
  </polygon>

  <!-- Floating circle right -->
  <circle cx="780" cy="140" r="10" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,12; 0,0" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating diamond top-left -->
  <polygon points="180,100 195,115 180,130 165,115" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.4" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 5,-8; 0,0" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 180 115; 180 180 115; 360 180 115" dur="4s" repeatCount="indefinite" additive="sum"/>
  </polygon>

  <!-- Floating hexagon top-right -->
  <polygon points="750,80 762,86 762,98 750,104 738,98 738,86" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -5,10; 0,0" dur="3.5s" repeatCount="indefinite"/>
  </polygon>

  <!-- Floating cross -->
  <g opacity="0.4" filter="url(#softGlow)">
    <line x1="720" y1="200" x2="740" y2="200" stroke="#fbbf24" stroke-width="2"/>
    <line x1="730" y1="190" x2="730" y2="210" stroke="#fbbf24" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 8,-6; 0,0" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CENTER NAME - BIG AND BOLD                          -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Glow behind name -->
  <ellipse cx="450" cy="165" rx="180" ry="50" fill="#a855f7" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="165" rx="150" ry="40" fill="#ff6b9d" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Name text -->
  <text x="450" y="155" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#glow)">NEEL SALOT</text>

  <!-- Tagline below -->
  <text x="450" y="185" font-family="Arial, sans-serif" font-size="16" fill="#00d4ff" text-anchor="middle" letter-spacing="4" font-weight="bold">
    FULL STACK · AI BUILDER · SYSTEMS THINKER
  </text>

  <!-- Decorative lines -->
  <line x1="250" y1="200" x2="380" y2="200" stroke="url(#neonPink)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="520" y1="200" x2="650" y2="200" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Dot separators -->
  <circle cx="395" cy="200" r="3" fill="#ff6b9d" filter="url(#softGlow)"/>
  <circle cx="505" cy="200" r="3" fill="#00d4ff" filter="url(#softGlow)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SHOOTING STARS                                       -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <line x1="0" y1="0" x2="0" y2="0" stroke="url(#neonYellow)" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)">
    <animate attributeName="x1" values="800;900" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="100;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="820;920" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="105;125" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
  </line>

  <line x1="0" y1="0" x2="0" y2="0" stroke="url(#neonPurple)" stroke-width="1.5" stroke-linecap="round" filter="url(#softGlow)">
    <animate attributeName="x1" values="100;200" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="y1" values="250;265" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="x2" values="120;220" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="y2" values="253;268" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </line>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FUN ACCENTS                                         -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Sparkle effects -->
  <g transform="translate(680, 130)" filter="url(#softGlow)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(220, 200)" filter="url(#softGlow)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#ff6b9d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#ff6b9d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ff6b9d" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ff6b9d" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2s" repeatCount="indefinite"/>
  </g>

</svg>
