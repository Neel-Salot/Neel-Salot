<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <!-- Rich dark gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    
    <!-- Accent gradients -->
    <linearGradient id="cyanFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    
    <linearGradient id="purpleFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <linearGradient id="greenFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="url(#cardBg)" rx="16"/>

  <!-- Animated grid background -->
  <g stroke="#2a2a4a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="700" y2="80">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="160" x2="700" y2="160"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="320" x2="700" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
  </g>

  <!-- Floating geometric accents -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="20" fill="none" stroke="#00d4ff" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="20s" repeatCount="indefinite"/>
    </circle>
    <rect x="630" cy="380" width="30" height="30" fill="none" stroke="#a855f7" stroke-width="1" transform="rotate(45, 645, 395)">
      <animateTransform attributeName="transform" type="rotate" from="45 645 395" to="405 645 395" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Title section with gradient accent -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="6" height="40" rx="3" fill="url(#cyanFlow)" filter="url(#glow)"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="26" fill="#ffffff" font-weight="600">
      Momentum AI
    </text>
    <text x="20" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#00d4ff" letter-spacing="1">
      MEETING INTELLIGENCE IN 48 HOURS
    </text>
  </g>

  <!-- Live indicator -->
  <g transform="translate(580, 45)">
    <circle cx="0" cy="0" r="5" fill="#22c55e">
      <animate attributeName="r" values="5;6;5" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="4" font-family="-apple-system, sans-serif" font-size="10" fill="#22c55e" letter-spacing="1">LIVE</text>
  </g>

  <!-- Audio visualization -->
  <g transform="translate(50, 110)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#4a6a8a" letter-spacing="1">⬡ TRANSCRIBING</text>
    
    <g transform="translate(0, 10)">
      <!-- Animated waveform bars -->
      <rect x="0" y="8" width="4" height="16" rx="2" fill="#00d4ff" opacity="0.9">
        <animate attributeName="height" values="8;24;12;20;8;24;20;12" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;0;10;6;12;0;6;10" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="8" y="4" width="4" height="24" rx="2" fill="#00d4ff" opacity="0.8">
        <animate attributeName="height" values="16;8;22;14;16;8;14;22" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;14;5;10;8;14;10;5" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="2" width="4" height="28" rx="2" fill="#00d4ff" opacity="1">
        <animate attributeName="height" values="12;28;18;24;12;28;24;18" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;0;7;4;10;0;4;7" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="5" width="4" height="22" rx="2" fill="#00d4ff" opacity="0.85">
        <animate attributeName="height" values="20;10;26;16;20;10;16;26" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;12;3;9;6;12;9;3" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="32" y="0" width="4" height="32" rx="2" fill="#00d4ff" opacity="0.9">
        <animate attributeName="height" values="14;30;20;26;14;30;26;20" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="9;0;7;3;9;0;3;7" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="3" width="4" height="26" rx="2" fill="#00d4ff" opacity="0.8">
        <animate attributeName="height" values="18;12;24;20;18;12;20;24" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="7;10;4;6;7;10;6;4" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="6" width="4" height="20" rx="2" fill="#00d4ff" opacity="0.75">
        <animate attributeName="height" values="22;14;18;24;22;14;24;18" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="5;9;7;4;5;9;4;7" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="56" y="1" width="4" height="30" rx="2" fill="#00d4ff" opacity="0.9">
        <animate attributeName="height" values="16;28;22;26;16;28;26;22" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;2;6;3;8;2;3;6" dur="0.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Pipeline visualization -->
  <g transform="translate(50, 175)">
    <!-- Flow arrows with animated particles -->
    <line x1="50" y1="25" x2="130" y2="25" stroke="url(#cyanFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#00d4ff" filter="url(#softGlow)">
      <animate attributeName="cx" values="50;130" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <line x1="200" y1="25" x2="280" y2="25" stroke="url(#purpleFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite" begin="0.33s"/>
    </line>
    <circle r="4" fill="#a855f7" filter="url(#softGlow)">
      <animate attributeName="cx" values="200;280" dur="1s" repeatCount="indefinite" begin="0.33s"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.33s"/>
    </circle>
    
    <line x1="350" y1="25" x2="430" y2="25" stroke="url(#greenFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite" begin="0.66s"/>
    </line>
    <circle r="4" fill="#22c55e" filter="url(#softGlow)">
      <animate attributeName="cx" values="350;430" dur="1s" repeatCount="indefinite" begin="0.66s"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.66s"/>
    </circle>

    <!-- Node boxes -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1.5"/>
      <rect x="0" y="0" width="110" height="50" rx="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="55" y="22" font-family="monospace" font-size="12" fill="#00d4ff" text-anchor="middle" font-weight="bold">WHISPER</text>
      <text x="55" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Transcription</text>
    </g>

    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#1a1a2e" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="0" y="0" width="110" height="50" rx="8" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <text x="55" y="22" font-family="monospace" font-size="12" fill="#a855f7" text-anchor="middle" font-weight="bold">GEMINI</text>
      <text x="55" y="38" font-family="monospace" font-size="9" fill="#6a4a8a" text-anchor="middle">AI Extraction</text>
    </g>

    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="0" y="0" width="110" height="50" rx="8" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <text x="55" y="22" font-family="monospace" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="bold">SUPABASE</text>
      <text x="55" y="38" font-family="monospace" font-size="9" fill="#4a6a5a" text-anchor="middle">Storage</text>
    </g>

    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#1a1a2e" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="0" y="0" width="110" height="50" rx="8" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </rect>
      <text x="55" y="22" font-family="monospace" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">REACT</text>
      <text x="55" y="38" font-family="monospace" font-size="9" fill="#6a5a4a" text-anchor="middle">Dashboard</text>
    </g>
  </g>

  <!-- Output cards section -->
  <g transform="translate(50, 265)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" fill="#6a6a8a" letter-spacing="1">OUTPUT</text>
    
    <!-- Decision card -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#1a1a2e" stroke="#a855f7" stroke-width="1"/>
      <rect x="0" y="0" width="190" height="60" rx="8" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="15" y="20" font-family="monospace" font-size="10" fill="#a855f7" font-weight="bold">DECISIONS</text>
      <text x="15" y="38" font-family="monospace" font-size="9" fill="#6a6a8a">▸ Q3 Launch: Sept 15</text>
      <text x="15" y="52" font-family="monospace" font-size="9" fill="#6a6a8a">▸ Stack: React + Supabase</text>
    </g>

    <!-- Action items card -->
    <g transform="translate(210, 15)">
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1"/>
      <rect x="0" y="0" width="190" height="60" rx="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <text x="15" y="20" font-family="monospace" font-size="10" fill="#00d4ff" font-weight="bold">ACTION ITEMS</text>
      <text x="15" y="38" font-family="monospace" font-size="9" fill="#6a6a8a">▸ Ship auth feature [P1]</text>
      <text x="15" y="52" font-family="monospace" font-size="9" fill="#6a6a8a">▸ Build dashboard [P1]</text>
    </g>

    <!-- Risk flags card -->
    <g transform="translate(420, 15)">
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#1a1a2e" stroke="#fbbf24" stroke-width="1"/>
      <rect x="0" y="0" width="190" height="60" rx="8" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <text x="15" y="20" font-family="monospace" font-size="10" fill="#fbbf24" font-weight="bold">RISK FLAGS</text>
      <text x="15" y="38" font-family="monospace" font-size="9" fill="#6a6a8a">⚠ 3 tasks due same day</text>
      <text x="15" y="52" font-family="monospace" font-size="9" fill="#4a8a5a">✓ No blockers</text>
    </g>
  </g>

  <!-- Progress bar -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="600" height="25" rx="12" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1"/>
    
    <text x="15" y="17" font-family="monospace" font-size="10" fill="#4a6a5a">$ momentum process meeting.mp3</text>
    
    <rect x="250" y="8" width="250" height="10" rx="5" fill="#0a0a1a"/>
    <rect x="252" y="10" width="0" height="6" rx="3" fill="url(#cyanFlow)" filter="url(#softGlow)">
      <animate attributeName="width" values="0;246" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <text x="515" y="17" font-family="monospace" font-size="10" fill="#00d4ff">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      100%
    </text>
  </g>

  <!-- Corner accents -->
  <g>
    <circle cx="20" cy="400" r="4" fill="#22c55e" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="400" r="4" fill="#a855f7" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>
