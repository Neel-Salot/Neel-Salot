  <text x="354" y="114" font-family="monospace" font-size="9" fill="#ff79c6" letter-spacing="1">DATABASES & TOOLS</text>

  <g transform="translate(340, 122)">
    <rect x="0" y="0" width="52" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="26" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">MySQL</text>

    <rect x="58" y="0" width="52" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="84" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Firebase</text>

    <rect x="116" y="0" width="52" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="142" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Supabase</text>

    <rect x="174" y="0" width="50" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
