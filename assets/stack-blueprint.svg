    <rect x="230" y="0" width="38" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="249" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Jira</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MOBILE                                               -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <rect x="620" y="48" width="8" height="20" fill="#50fa7b" opacity="0.3"/>
  <text x="634" y="62" font-family="monospace" font-size="9" fill="#50fa7b" letter-spacing="1">MOBILE</text>

  <g transform="translate(620, 70)">
    <rect x="0" y="0" width="50" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="25" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Flutter</text>

    <rect x="56" y="0" width="46" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="79" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Kotlin</text>

    <rect x="108" y="0" width="52" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="134" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">TensorFlow</text>

    <rect x="166" y="0" width="52" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="192" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">MediaPipe</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MOBILE MODULES                                       -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <rect x="620" y="100" width="8" height="20" fill="#ffb86c" opacity="0.3"/>
  <text x="634" y="114" font-family="monospace" font-size="9" fill="#ffb86c" letter-spacing="1">DOMAINS</text>

  <g transform="translate(620, 122)">
    <rect x="0" y="0" width="90" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="45" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Computer Vision</text>

    <rect x="96" y="0" width="80" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="136" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">NLP & ML</text>

    <rect x="182" y="0" width="60" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="212" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Serverless</text>
  </g>

  <!-- Bottom bar -->
  <line x1="0" y1="172" x2="900" y2="172" stroke="#1a1a2e" stroke-width="0.5"/>

  <!-- Corner markers -->
  <text x="880" y="176" font-family="monospace" font-size="8" fill="#2a2a4a">╗</text>

</svg>
