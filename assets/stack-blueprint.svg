  <!-- ═══════════════════════════════════════════════════════ -->

  <rect x="30" y="100" width="8" height="20" fill="#bd93f9" opacity="0.3"/>
  <text x="44" y="114" font-family="monospace" font-size="9" fill="#bd93f9" letter-spacing="1">AI & LLMs</text>

  <g transform="translate(30, 122)">
    <rect x="0" y="0" width="70" height="18" rx="3" fill="#bd93f9" fill-opacity="0.08" stroke="#bd93f9" stroke-width="0.8" opacity="0.7"/>
    <text x="35" y="12" font-family="monospace" font-size="8" fill="#bd93f9" text-anchor="middle">Agentic AI</text>

    <rect x="76" y="0" width="46" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="99" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Gemini</text>

    <rect x="128" y="0" width="46" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="151" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Whisper</text>

