    <rect x="54" y="0" width="42" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="75" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">Python</text>

    <rect x="102" y="0" width="38" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="121" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">PHP</text>

    <rect x="146" y="0" width="46" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="169" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">.NET</text>
  </g>

