<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180">
  <defs>
    <filter id="sglow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="blueGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="180" fill="#0a0a12"/>
  <rect width="900" height="180" fill="url(#blueGrid)" opacity="0.3"/>

  <!-- Section label -->
  <text x="20" y="28" font-family="monospace" font-size="9" fill="#3a3a5a" letter-spacing="2">// TECH STACK</text>
  <line x1="20" y1="35" x2="180" y2="35" stroke="#2a2a3e" stroke-width="0.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FRONTEND                                             -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Section header -->
  <rect x="30" y="48" width="8" height="20" fill="#00d4ff" opacity="0.3"/>
  <text x="44" y="62" font-family="monospace" font-size="9" fill="#00d4ff" letter-spacing="1">FRONTEND</text>

  <!-- Tech pills -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="52" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="26" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">React</text>

    <rect x="58" y="0" width="48" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="82" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">TypeScript</text>

    <rect x="112" y="0" width="48" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="136" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">JavaScript</text>

    <rect x="166" y="0" width="38" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="185" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">CSS</text>

    <rect x="210" y="0" width="38" height="18" rx="3" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
    <text x="229" y="12" font-family="monospace" font-size="8" fill="#7a7a9a" text-anchor="middle">HTML</text>
  </g>

