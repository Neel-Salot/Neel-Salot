<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="100%">
  <style>
    .section-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 24px;
      font-weight: 900;
      fill: #000000;
      letter-spacing: 1px;
    }
    .card-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
    }
    .card-body {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      fill: #000000;
    }
    .btn-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      font-weight: 900;
      fill: #000000;
    }
    a {
      text-decoration: none;
      cursor: pointer;
    }
    /* Subtle hover scale effect */
    .project-card:hover {
      filter: brightness(1.05);
    }
  </style>

  <!-- Outer Shadow -->
  <rect x="12" y="12" width="776" height="286" rx="6" fill="#000000" />

  <!-- Outer Card Body -->
  <rect x="4" y="4" width="776" height="286" rx="6" fill="#FF007F" stroke="#000000" stroke-width="4" />

  <!-- Section Title -->
  <text x="30" y="42" class="section-title">// FEATURED BUILDS (CLICK TO AUDIT)</text>

  <!-- PROJECT 1: Momentum AI -->
  <a href="https://github.com/yugamm15/momentum-ai" target="_blank" class="project-card">
    <g transform="translate(35, 72) rotate(-1.5)">
      <!-- Shadow -->
      <rect x="6" y="6" width="220" height="190" rx="3" fill="#000000" />
      <!-- Box -->
      <rect x="0" y="0" width="220" height="190" rx="3" fill="#FFE600" stroke="#000000" stroke-width="3" />
      <!-- Content -->
      <text x="15" y="30" class="card-title">1. MOMENTUM AI</text>
      <line x1="15" y1="42" x2="205" y2="42" stroke="#000000" stroke-width="2" />
      
      <text x="15" y="62" class="card-body">■ Meeting Intelligence</text>
      <text x="15" y="77" class="card-body">■ Whisper → Gemini → Supabase</text>
      <text x="15" y="92" class="card-body">■ Built in 48-hr Hackathon</text>
      
      <text x="15" y="120" class="card-body" font-style="italic">"Designed an end-to-end</text>
      <text x="15" y="135" class="card-body" font-style="italic">AI pipeline with fallback</text>
      <text x="15" y="150" class="card-body" font-style="italic">persistence layer."</text>
      
      <!-- Button -->
      <rect x="15" y="160" width="105" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
      <text x="22" y="172" class="btn-text">REPOSITORY ➔</text>
    </g>
  </a>

  <!-- PROJECT 2: KairoAI -->
  <a href="https://github.com/meghmodi2810/KairoAI" target="_blank" class="project-card">
    <g transform="translate(285, 72) rotate(1.2)">
      <!-- Shadow -->
      <rect x="6" y="6" width="220" height="190" rx="3" fill="#000000" />
      <!-- Box -->
      <rect x="0" y="0" width="220" height="190" rx="3" fill="#00E5FF" stroke="#000000" stroke-width="3" />
      <!-- Content -->
      <text x="15" y="30" class="card-title">2. KAIROAI</text>
      <line x1="15" y1="42" x2="205" y2="42" stroke="#000000" stroke-width="2" />
      
      <text x="15" y="62" class="card-body">■ Sign Language Platform</text>
      <text x="15" y="77" class="card-body">■ Flutter, MediaPipe, TFLite</text>
      <text x="15" y="92" class="card-body">■ On-Device Gesture Tracking</text>
      
      <text x="15" y="120" class="card-body" font-style="italic">"Camera-based sign language</text>
      <text x="15" y="135" class="card-body" font-style="italic">learning feedback loop."</text>
      <text x="15" y="150" class="card-body" font-style="italic">Presented at ACAI-2026.</text>
      
      <!-- Button -->
      <rect x="15" y="160" width="105" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
      <text x="22" y="172" class="btn-text">REPOSITORY ➔</text>
    </g>
  </a>

  <!-- PROJECT 3: DailyNest -->
  <a href="https://github.com/meghmodi2810/DailyNest" target="_blank" class="project-card">
    <g transform="translate(535, 72) rotate(-0.8)">
      <!-- Shadow -->
      <rect x="6" y="6" width="220" height="190" rx="3" fill="#000000" />
      <!-- Box -->
      <rect x="0" y="0" width="220" height="190" rx="3" fill="#00FF66" stroke="#000000" stroke-width="3" />
      <!-- Content -->
      <text x="15" y="30" class="card-title">3. DAILYNEST</text>
      <line x1="15" y1="42" x2="205" y2="42" stroke="#000000" stroke-width="2" />
      
      <text x="15" y="62" class="card-body">■ Autism Support System</text>
      <text x="15" y="77" class="card-body">■ Django, CNNs, NLP Engine</text>
      <text x="15" y="92" class="card-body">■ Stress pattern detection</text>
      
      <text x="15" y="120" class="card-body" font-style="italic">"Caregiver analytics dashboard</text>
      <text x="15" y="135" class="card-body" font-style="italic">combining routine &amp; emotion."</text>
      <text x="15" y="150" class="card-body" font-style="italic">Best Paper Award 🏆</text>
      
      <!-- Button -->
      <rect x="15" y="160" width="105" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
      <text x="22" y="172" class="btn-text">REPOSITORY ➔</text>
    </g>
  </a>
</svg>
