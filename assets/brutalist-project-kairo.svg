<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 200" width="100%">
  <style>
    .card-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
    }
    .card-body {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      fill: #000000;
    }
    .btn-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      font-weight: 900;
      fill: #000000;
    }
  </style>

  <!-- Shadow -->
  <rect x="8" y="8" width="234" height="184" rx="4" fill="#000000" />
  
  <!-- Box -->
  <rect x="0" y="0" width="234" height="184" rx="4" fill="#00E5FF" stroke="#000000" stroke-width="3" />
  
  <!-- Content -->
  <text x="15" y="30" class="card-title">2. KAIROAI</text>
  <line x1="15" y1="42" x2="219" y2="42" stroke="#000000" stroke-width="2" />
  
  <text x="15" y="62" class="card-body">■ Sign Language Learning App</text>
  <text x="15" y="77" class="card-body">■ Flutter + MediaPipe + TFLite</text>
  <text x="15" y="92" class="card-body">■ Real-time gesture feedback</text>
  
  <text x="15" y="120" class="card-body" font-style="italic">"Camera-based sign language</text>
  <text x="15" y="135" class="card-body" font-style="italic">learning feedback loop."</text>
  <text x="15" y="150" class="card-body" font-style="italic">Presented at ACAI-2026.</text>
  
  <!-- Button -->
  <rect x="15" y="160" width="95" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="22" y="172" class="btn-text">VIEW REPO ➔</text>
</svg>
