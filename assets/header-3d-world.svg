<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <defs>
    <!-- Clean minimal gradients -->
    <linearGradient id="deepBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1629"/>
      <stop offset="100%" stop-color="#162447"/>
    </linearGradient>

    <linearGradient id="warmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#feca57"/>
    </linearGradient>

    <linearGradient id="coolAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5f27cd"/>
      <stop offset="100%" stop-color="#48dbfb"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="extrglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Perspective grid pattern -->
    <pattern id="perspectiveGrid" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="perspective(200)">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Deep background -->
  <rect width="900" height="300" fill="url(#deepBlue)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- INFINITE PERSPECTIVE GRID - vanishing point in center        -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Horizontal lines with perspective -->
  <g stroke="#1a3a5a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="250" x2="900" y2="250">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="220" x2="900" y2="220">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="0" y1="195" x2="900" y2="195">
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="0" y1="175" x2="900" y2="175">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </line>
    <line x1="0" y1="160" x2="900" y2="160">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="4s" repeatCount="indefinite" begin="2s"/>
    </line>
    <line x1="0" y1="150" x2="900" y2="150">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite" begin="2.5s"/>
    </line>
  </g>

  <!-- Vertical lines converging to center -->
  <g stroke="#1a3a5a" stroke-width="0.5" opacity="0.3">
    <line x1="450" y1="150" x2="0" y2="250">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="150" x2="150" y2="250">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="450" y1="150" x2="300" y2="250">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    <line x1="450" y1="150" x2="450" y2="250">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" begin="0.9s"/>
    </line>
    <line x1="450" y1="150" x2="600" y2="250">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" begin="1.2s"/>
    </line>
    <line x1="450" y1="150" x2="750" y2="250">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </line>
    <line x1="450" y1="150" x2="900" y2="250">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite" begin="1.8s"/>
    </line>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- FLOATING 3D CUBES - depth layers                          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Back layer cube - small, faded -->
  <g transform="translate(120, 80)">
    <animateTransform attributeName="transform" type="translate" values="120,80;125,75;120,80" dur="6s" repeatCount="indefinite"/>
    <polygon points="20,0 40,10 40,35 20,25" fill="#1a3a5a" opacity="0.3"/>
    <polygon points="0,10 20,0 20,25 0,35" fill="#152535" opacity="0.3"/>
    <polygon points="0,10 40,10 20,0" fill="#2a4a6a" opacity="0.3"/>
  </g>

  <!-- Right floating cube -->
  <g transform="translate(720, 60)">
    <animateTransform attributeName="transform" type="translate" values="720,60;715,65;720,60" dur="5s" repeatCount="indefinite"/>
    <polygon points="20,0 40,10 40,35 20,25" fill="#5f27cd" opacity="0.4"/>
    <polygon points="0,10 20,0 20,25 0,35" fill="#4a1a9a" opacity="0.4"/>
    <polygon points="0,10 40,10 20,0" fill="#7f47dd" opacity="0.5"/>
  </g>

  <!-- Left floating cube -->
  <g transform="translate(80, 150)">
    <animateTransform attributeName="transform" type="translate" values="80,150;85,145;80,150" dur="7s" repeatCount="indefinite"/>
    <polygon points="15,0 30,8 30,25 15,18" fill="#ff6b6b" opacity="0.35"/>
    <polygon points="0,8 15,0 15,18 0,25" fill="#cc5555" opacity="0.35"/>
    <polygon points="0,8 30,8 15,0" fill="#ff8888" opacity="0.4"/>
  </g>

  <!-- Bottom right small cube -->
  <g transform="translate(780, 180)">
    <animateTransform attributeName="transform" type="translate" values="780,180;775,185;780,180" dur="4s" repeatCount="indefinite"/>
    <polygon points="12,0 24,6 24,20 12,14" fill="#feca57" opacity="0.35"/>
    <polygon points="0,6 12,0 12,14 0,20" fill="#ccaa35" opacity="0.35"/>
    <polygon points="0,6 24,6 12,0" fill="#ffdd77" opacity="0.4"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CENTRAL NAME - the hero element                            -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Deep glow behind name -->
  <ellipse cx="450" cy="145" rx="200" ry="50" fill="#48dbfb" opacity="0.05">
    <animate attributeName="opacity" values="0.05;0.1;0.05" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Main name -->
  <text x="450" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="12" filter="url(#extrglow)">
    NEEL SALOT
  </text>

  <!-- Subtle underline -->
  <line x1="300" y1="145" x2="600" y2="145" stroke="url(#coolAccent)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Tagline -->
  <text x="450" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle" letter-spacing="4">
    FULL STACK · AI BUILDER · SYSTEMS THINKER
  </text>

  <!-- Floating dots around name -->
  <circle cx="280" cy="120" r="3" fill="#ff6b6b" opacity="0.6">
    <animate attributeName="cy" values="120;115;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="125" r="3" fill="#48dbfb" opacity="0.6">
    <animate attributeName="cy" values="125;120;125" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="160" r="2" fill="#5f27cd" opacity="0.5">
    <animate attributeName="cy" values="160;155;160" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="158" r="2" fill="#feca57" opacity="0.5">
    <animate attributeName="cy" values="158;153;158" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- DEPTH PARTICLES - layered with different speeds             -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Far layer - slow -->
  <circle cx="50" cy="200" r="1" fill="#ffffff" opacity="0.2">
    <animate attributeName="cx" values="50;850;50" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="80" r="1.5" fill="#48dbfb" opacity="0.15">
    <animate attributeName="cx" values="200;900;200" dur="25s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="1" fill="#ff6b6b" opacity="0.2">
    <animate attributeName="cx" values="600;100;600" dur="22s" repeatCount="indefinite"/>
  </circle>

  <!-- Mid layer - medium -->
  <circle cx="150" cy="250" r="2" fill="#ffffff" opacity="0.3">
    <animate attributeName="cx" values="150;750;150" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="60" r="1.5" fill="#5f27cd" opacity="0.25">
    <animate attributeName="cx" values="400;500;400" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="230" r="2" fill="#feca57" opacity="0.25">
    <animate attributeName="cx" values="700;200;700" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Near layer - fast -->
  <circle cx="100" cy="130" r="2.5" fill="#48dbfb" opacity="0.4">
    <animate attributeName="cx" values="100;800;100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="100" r="2" fill="#ff6b6b" opacity="0.35">
    <animate attributeName="cx" values="800;100;800" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- FLOATING RINGS - orbital feel but minimal                  -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <ellipse cx="450" cy="145" rx="180" ry="60" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1">
    <animateTransform attributeName="transform" type="rotate" from="0 450 145" to="360 450 145" dur="30s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="450" cy="145" rx="220" ry="80" fill="none" stroke="#48dbfb" stroke-width="0.3" opacity="0.08">
    <animateTransform attributeName="transform" type="rotate" from="360 450 145" to="0 450 145" dur="40s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SUBTLE CORNER DETAILS                                    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Top left -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#2a4a6a" stroke-width="1"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#2a4a6a" stroke-width="1"/>

  <!-- Top right -->
  <line x1="880" y1="20" x2="840" y2="20" stroke="#2a4a6a" stroke-width="1"/>
  <line x1="880" y1="20" x2="880" y2="60" stroke="#2a4a6a" stroke-width="1"/>

  <!-- Bottom markers -->
  <text x="450" y="285" font-family="monospace" font-size="8" fill="#2a4a6a" text-anchor="middle" letter-spacing="2">
    ─── SURAT, GUJARAT ───
  </text>

</svg>
