<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <style>
    .section-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 24px;
      font-weight: 900;
      fill: #000000;
      letter-spacing: 1px;
    }
    .category-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 900;
      fill: #000000;
    }
    .stat-label {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      font-weight: 900;
      fill: #000000;
    }
    .stat-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      font-weight: bold;
      fill: #222222;
    }
  </style>

  <!-- Outer Shadow -->
  <rect x="12" y="12" width="776" height="236" rx="6" fill="#000000" />

  <!-- Outer Card Body -->
  <rect x="4" y="4" width="776" height="236" rx="6" fill="#00FF66" stroke="#000000" stroke-width="4" />

  <!-- Section Title -->
  <text x="30" y="42" class="section-title">// EDUCATION &amp; RESEARCH</text>

  <!-- ACADEMICS CARD -->
  <g transform="translate(35, 68)">
    <!-- Shadow -->
    <rect x="5" y="5" width="355" height="160" rx="3" fill="#000000" />
    <!-- Box -->
    <rect x="0" y="0" width="355" height="160" rx="3" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[EDUCATION]</text>
    <line x1="15" y1="33" x2="340" y2="33" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
    
    <text x="15" y="55" class="stat-label">Degree  : <tspan class="stat-value" font-weight="normal">B.Sc. Information Technology</tspan></text>
    <text x="15" y="73" class="stat-label">College : <tspan class="stat-value" font-weight="normal">BMIIT, Surat (2023 - 2026)</tspan></text>
    <text x="15" y="91" class="stat-label">CGPA    : <tspan class="stat-value">9.46 / 10.0</tspan></text>
    <text x="15" y="109" class="stat-label">Honors  : <tspan class="stat-value">2x Semester Topper (Excellence)</tspan></text>
    
    <line x1="15" y1="120" x2="340" y2="120" stroke="#000000" stroke-width="1" stroke-dasharray="2 2" />
    <text x="15" y="138" class="stat-label">Class XII (GSEB) : <tspan class="stat-value" font-weight="normal">Jeevan Bharti, Surat (90.13%)</tspan></text>
  </g>

  <!-- RESEARCH & PUBLICATIONS CARD -->
  <g transform="translate(410, 68)">
    <!-- Shadow -->
    <rect x="5" y="5" width="355" height="160" rx="3" fill="#000000" />
    <!-- Box -->
    <rect x="0" y="0" width="355" height="160" rx="3" fill="#FF55BB" stroke="#000000" stroke-width="2.5" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[RESEARCH &amp; PUBLICATIONS]</text>
    <line x1="15" y1="33" x2="340" y2="33" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
    
    <text x="15" y="55" class="stat-label">■ Autism Support Platform (CSRI)</text>
    <text x="30" y="72" class="stat-value">- BEST RESEARCH PAPER AWARD 🏆</text>
    <text x="30" y="87" class="stat-value">- ML pattern stress detection models</text>
    
    <line x1="15" y1="98" x2="340" y2="98" stroke="#000000" stroke-width="1" stroke-dasharray="2 2" />
    
    <text x="15" y="117" class="stat-label">■ KairoAI ISL gesture Platform</text>
    <text x="30" y="134" class="stat-value">- Presented at ACAI-2026 Conference</text>
    <text x="30" y="149" class="stat-value">- Real-time hand skeletal tracking</text>
  </g>
</svg>
