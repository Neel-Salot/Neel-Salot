<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <!-- Warm editorial palette -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    
    <!-- Accent colors - indigo/slate for accessibility -->
    <linearGradient id="indigoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#7986cb"/>
    </linearGradient>
    
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>
    
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec407a"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Warm background -->
  <rect width="600" height="340" fill="url(#warmBg)" rx="12"/>

  <!-- Subtle paper texture -->
  <g fill="#e8e4df" opacity="0.3">
    <circle cx="50" cy="50" r="1"/>
    <circle cx="150" cy="80" r="1"/>
    <circle cx="250" cy="30" r="1"/>
    <circle cx="350" cy="70" r="1"/>
    <circle cx="450" cy="40" r="1"/>
    <circle cx="550" cy="60" r="1"/>
    <circle cx="100" cy="300" r="1"/>
    <circle cx="300" cy="320" r="1"/>
    <circle cx="500" cy="290" r="1"/>
  </g>

  <!-- Hand gesture detection area -->
  <g transform="translate(30, 25)">
    <text x="0" y="15" font-family="Georgia, serif" font-size="10" fill="#8a8a8a" letter-spacing="1">REAL-TIME DETECTION</text>
    
    <!-- Animated hand skeleton lines -->
    <g transform="translate(10, 30)" stroke="#5c6bc0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
      <!-- Palm -->
      <path d="M30,50 L30,70 L50,70 L50,50 Z">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Fingers with animation -->
      <g>
        <line x1="30" y1="50" x2="25" y2="30">
          <animate attributeName="x2" values="25;22;25" dur="1.5s" repeatCount="indefinite"/>
        </line>
        <line x1="37" y1="50" x2="37" y2="25">
          <animate attributeName="y2" values="25;22;25" dur="1.2s" repeatCount="indefinite"/>
        </line>
        <line x1="44" y1="50" x2="49" y2="30">
          <animate attributeName="x2" values="49;52;49" dur="1.4s" repeatCount="indefinite"/>
        </line>
        <line x1="50" y1="50" x2="55" y2="35">
          <animate attributeName="x2" values="55;58;55" dur="1.3s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
    
    <!-- Detection confidence indicator -->
    <g transform="translate(100, 35)">
      <rect x="0" y="0" width="60" height="25" rx="4" fill="white" stroke="#e8e4df" stroke-width="1"/>
      <text x="30" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#4a4a4a" text-anchor="middle">97.3%</text>
      <circle cx="52" cy="12" r="4" fill="#26a69a">
        <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#26a69a;#4db6ac;#26a69a" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Platform flow -->
  <g transform="translate(30, 100)">
    <!-- Flow arrows -->
    <line x1="100" y1="25" x2="160" y2="25" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="100" cy="25" r="3" fill="url(#indigoAccent)">
      <animate attributeName="cx" values="100;150" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <line x1="280" y1="25" x2="340" y2="25" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="280" cy="25" r="3" fill="url(#tealAccent)">
      <animate attributeName="cx" values="280;330" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
  </g>

  <!-- Platform nodes -->
  <g transform="translate(30, 130)">
    <!-- Flutter node -->
    <rect x="0" y="0" width="140" height="50" rx="8" fill="white" stroke="#5c6bc0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="70" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">Flutter</text>
    <text x="70" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Mobile App</text>
  </g>

  <!-- MediaPipe node -->
  <g transform="translate(200, 130)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="white" stroke="#26a69a" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="70" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">MediaPipe</text>
    <text x="70" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Hand Tracking</text>
  </g>

  <!-- TensorFlow Lite node -->
  <g transform="translate(370, 130)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="white" stroke="#ec407a" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="70" y="22" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600">TensorFlow</text>
    <text x="70" y="38" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Gesture ML</text>
  </g>

  <!-- Learning modules -->
  <g transform="translate(30, 200)">
    <text x="0" y="15" font-family="Georgia, serif" font-size="11" fill="#4a4a4a">Learning Modules</text>
    
    <!-- Module cards with staggered animation -->
    <g>
      <rect x="0" y="25" width="165" height="55" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="25" width="4" height="55" rx="2" fill="url(#indigoAccent)"/>
      <text x="15" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#5c6bc0" font-weight="500">Alphabet Recognition</text>
      <text x="15" y="62" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a">A-Z hand signs</text>
    </g>

    <g>
      <rect x="180" y="25" width="165" height="55" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="180" y="25" width="4" height="55" rx="2" fill="url(#tealAccent)"/>
      <text x="195" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#26a69a" font-weight="500">Word Practice</text>
      <text x="195" y="62" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a">Common words</text>
    </g>

    <g>
      <rect x="360" y="25" width="165" height="55" rx="8" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="360" y="25" width="4" height="55" rx="2" fill="url(#roseAccent)"/>
      <text x="375" y="45" font-family="-apple-system, sans-serif" font-size="10" fill="#ec407a" font-weight="500">Quiz Mode</text>
      <text x="375" y="62" font-family="-apple-system, sans-serif" font-size="9" fill="#8a8a8a">Test your skills</text>
    </g>
  </g>

  <!-- Conference badge -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="540" height="35" rx="6" fill="white" stroke="#e8e4df" stroke-width="1" filter="url(#cardShadow)"/>
    
    <circle cx="25" cy="17" r="8" fill="#5c6bc0" opacity="0.1"/>
    <text x="25" y="21" font-family="-apple-system, sans-serif" font-size="8" fill="#5c6bc0" text-anchor="middle" font-weight="600">ACAI</text>
    
    <text x="50" y="21" font-family="-apple-system, sans-serif" font-size="11" fill="#4a4a4a">Published at ACAI-2026, National Conference on AI</text>
    
    <text x="510" y="21" font-family="Georgia, serif" font-size="10" fill="#26a69a" text-anchor="end">
      <tspan fill="#26a69a">●</tspan> Live
    </text>
  </g>

  <!-- Title footer -->
  <text x="300" y="332" font-family="Georgia, serif" font-size="10" fill="#8a8a8a" text-anchor="middle" letter-spacing="0.5">Kairo AI — Breaking Barriers with Computer Vision</text>
</svg>
