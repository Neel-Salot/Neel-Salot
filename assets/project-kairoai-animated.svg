<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad2)" rx="12"/>

  <!-- Animated background particles -->
  <circle cx="50" cy="50" r="2" fill="#a855f7" opacity="0.4">
    <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="80" r="1.5" fill="#ff6b9d" opacity="0.3">
    <animate attributeName="cy" values="80;70;80" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="300" r="1.5" fill="#00d4ff" opacity="0.3">
    <animate attributeName="cy" values="300;290;300" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="280" r="2" fill="#fbbf24" opacity="0.4">
    <animate attributeName="cy" values="280;270;280" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Camera detection frame - animated -->
  <g transform="translate(150, 30)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="300" height="180" rx="8" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Corner brackets - animated -->
    <path d="M0,20 L0,0 L20,0" stroke="#a855f7" stroke-width="3" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M280,0 L300,0 L300,20" stroke="#a855f7" stroke-width="3" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M0,160 L0,180 L20,180" stroke="#a855f7" stroke-width="3" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </path>
    <path d="M280,180 L300,180 L300,160" stroke="#a855f7" stroke-width="3" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
    </path>

    <!-- Scanning line animation -->
    <line x1="10" y1="0" x2="10" y2="180" stroke="#a855f7" stroke-width="1" opacity="0.5">
      <animate attributeName="x1" values="10;290;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="10;290;10" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Floating hand - animated -->
    <g transform="translate(130, 60)">
      <animateTransform attributeName="transform" type="translate" values="130,60;130,55;130,60" dur="2s" repeatCount="indefinite"/>

      <!-- Hand outline -->
      <ellipse cx="20" cy="45" rx="18" ry="25" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
      <!-- Palm -->
      <path d="M5,40 Q20,30 35,40 L38,60 Q20,70 2,60 Z" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
      <!-- Fingers -->
      <path d="M8,38 L8,15 Q10,10 14,15 L14,38" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8">
        <animate attributeName="d" values="M8,38 L8,15 Q10,10 14,15 L14,38;M8,38 L8,12 Q10,7 14,12 L14,38;M8,38 L8,15 Q10,10 14,15 L14,38" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M14,35 L14,10 Q17,5 20,10 L20,35" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8">
        <animate attributeName="d" values="M14,35 L14,10 Q17,5 20,10 L20,35;M14,35 L14,7 Q17,2 20,7 L20,35;M14,35 L14,10 Q17,5 20,10 L20,35" dur="1.5s" repeatCount="indefinite" begin="0.1s"/>
      </path>
      <path d="M20,33 L20,8 Q23,3 26,8 L26,33" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8">
        <animate attributeName="d" values="M20,33 L20,8 Q23,3 26,8 L26,33;M20,33 L20,5 Q23,0 26,5 L26,33;M20,33 L20,8 Q23,3 26,8 L26,33" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      </path>
      <path d="M26,35 L26,12 Q29,7 32,12 L32,35" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8">
        <animate attributeName="d" values="M26,35 L26,12 Q29,7 32,12 L32,35;M26,35 L26,9 Q29,4 32,9 L32,35;M26,35 L26,12 Q29,7 32,12 L32,35" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      </path>
      <!-- Thumb -->
      <path d="M2,45 Q-5,40 -5,50 Q-5,60 5,58" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7">
        <animate attributeName="d" values="M2,45 Q-5,40 -5,50 Q-5,60 5,58;M2,45 Q-8,38 -8,48 Q-8,58 5,56;M2,45 Q-5,40 -5,50 Q-5,60 5,58" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Detection label -->
    <text x="150" y="170" font-family="monospace" font-size="10" fill="#a855f7" text-anchor="middle" opacity="0.8">
      ◉ HAND DETECTED
    </text>
  </g>

  <!-- Tech stack pills -->
  <g transform="translate(30, 230)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#3a3a5a" letter-spacing="1">// MEDIAPIPE TENSORFLOW LITE FLUTTER</text>

    <!-- Pills with pulsing glow -->
    <rect x="0" y="10" width="70" height="20" rx="10" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1">
      <animate attributeName="fill-opacity" values="0.15;0.25;0.15" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="35" y="24" font-family="monospace" font-size="8" fill="#a855f7" text-anchor="middle">MediaPipe</text>

    <rect x="80" y="10" width="80" height="20" rx="10" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="fill-opacity" values="0.15;0.25;0.15" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <text x="120" y="24" font-family="monospace" font-size="8" fill="#00d4ff" text-anchor="middle">TensorFlow Lite</text>

    <rect x="170" y="10" width="55" height="20" rx="10" fill="#ff6b9d" fill-opacity="0.15" stroke="#ff6b9d" stroke-width="1">
      <animate attributeName="fill-opacity" values="0.15;0.25;0.15" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <text x="197" y="24" font-family="monospace" font-size="8" fill="#ff6b9d" text-anchor="middle">Flutter</text>

    <rect x="235" y="10" width="60" height="20" rx="10" fill="#50fa7b" fill-opacity="0.15" stroke="#50fa7b" stroke-width="1">
      <animate attributeName="fill-opacity" values="0.15;0.25;0.15" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
    <text x="265" y="24" font-family="monospace" font-size="8" fill="#50fa7b" text-anchor="middle">Firebase</text>
  </g>

  <!-- Module cards -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="120" height="55" rx="6" fill="#0a0a1a" stroke="#2a2a4a" stroke-width="1"/>
    <text x="60" y="18" font-family="monospace" font-size="9" fill="#7a7a9a" text-anchor="middle">LESSON FLOW</text>
    <text x="60" y="32" font-family="monospace" font-size="8" fill="#4a4a6a" text-anchor="middle">Structured learning</text>
    <text x="60" y="44" font-family="monospace" font-size="8" fill="#4a4a6a" text-anchor="middle">paths</text>

    <rect x="130" y="0" width="120" height="55" rx="6" fill="#0a0a1a" stroke="#2a2a4a" stroke-width="1"/>
    <text x="190" y="18" font-family="monospace" font-size="9" fill="#7a7a9a" text-anchor="middle">PRACTICE</text>
    <text x="190" y="32" font-family="monospace" font-size="8" fill="#4a4a6a" text-anchor="middle">Interactive</text>
    <text x="190" y="44" font-family="monospace" font-size="8" fill="#4a4a6a" text-anchor="middle">sessions</text>

    <rect x="260" y="0" width="120" height="55" rx="6" fill="#0a0a1a" stroke="#2a2a4a" stroke-width="1"/>
    <text x="320" y="18" font-family="monospace" font-size="9" fill="#7a7a9a" text-anchor="middle">FEEDBACK</text>
    <text x="320" y="32" font-family="monospace" font-size="8" fill="#4a4a6a" text-anchor="middle">Real-time</text>
    <text x="320" y="44" font-family="monospace" font-size="8" fill="#4a4a6a" text-anchor="middle">correction</text>
  </g>

  <!-- Conference badge -->
  <g transform="translate(430, 265)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#0a0a1a" stroke="#fbbf24" stroke-width="1.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="20" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">ACAi-2026</text>
    <text x="70" y="34" font-family="monospace" font-size="7" fill="#8a7a5a" text-anchor="middle">National Conference on AI</text>
    <text x="70" y="48" font-family="monospace" font-size="7" fill="#6a5a4a" text-anchor="middle">★ Published Research</text>
  </g>

  <!-- Title -->
  <text x="300" y="328" font-family="monospace" font-size="10" fill="#3a3a5a" text-anchor="middle">KAIRO AI — Indian Sign Language Learning Platform</text>

  <!-- Corner decorations -->
  <circle cx="15" cy="325" r="3" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="585" cy="325" r="3" fill="#ff6b9d" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>
