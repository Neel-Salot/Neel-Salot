<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1e2e" stroke-width="0.5"/>
    </pattern>

    <!-- Isometric grid pattern -->
    <pattern id="isoGrid" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 M 0 17.32 L 30 0 M 0 17.32 L 30 34.64 M 30 34.64 L 60 17.32" fill="none" stroke="#2a2a3e" stroke-width="0.5"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon cyan gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Purple gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>

    <!-- Side face gradient (darker) -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#12121f"/>
    </linearGradient>

    <!-- Top face gradient -->
    <linearGradient id="topGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>

    <!-- Front face -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="#0a0a12"/>
  <rect width="900" height="280" fill="url(#isoGrid)" opacity="0.4"/>

  <!-- Perspective floor grid lines -->
  <g stroke="#1a1a30" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="220" x2="900" y2="220"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LEFT BLOCK - ISOMETRIC CUBE "FRONTEND"                -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Front face -->
  <polygon points="80,200 220,200 220,120 80,120" fill="#12121f" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Top face -->
  <polygon points="80,120 220,120 260,100 120,100" fill="#1a1a28" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Right face -->
  <polygon points="220,120 260,100 260,180 220,200" fill="#0d0d18" stroke="#2a2a3e" stroke-width="1"/>

  <!-- Front face details -->
  <polygon points="85,195 215,195 215,125 85,125" fill="none" stroke="#2a2a3e" stroke-width="0.5"/>

  <!-- Cube label -->
  <text x="150" y="162" font-family="monospace" font-size="11" fill="#4a4a6a" text-anchor="middle">FRONTEND</text>

  <!-- Tech indicators on cube -->
  <circle cx="110" cy="178" r="4" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="130" cy="178" r="4" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="150" cy="178" r="4" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="170" cy="178" r="4" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="190" cy="178" r="4" fill="#00d4ff" filter="url(#glow)"/>


  <!-- ══════════════════════════════════════════════════════ -->
  <!-- CENTER BLOCK - MAIN NAME ISOMETRIC STRUCTURE         -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Large isometric slab - main name block -->
  <!-- Back face (hidden) -->
  <polygon points="300,100 700,100 740,80 340,80" fill="none" stroke="#1a1a30" stroke-width="0.5"/>

  <!-- Bottom face -->
  <polygon points="300,210 700,210 740,190 340,190" fill="#0a0a12" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Left face -->
  <polygon points="300,100 340,80 340,190 300,210" fill="#0d0d18" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Right face -->
  <polygon points="700,100 740,80 740,190 700,210" fill="#0d0d18" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Top face -->
  <polygon points="300,100 700,100 740,80 340,80" fill="#12121f" stroke="#2a2a3e" stroke-width="1"/>

  <!-- Front face with name -->
  <polygon points="305,105 695,105 695,205 305,205" fill="#0f0f1a" stroke="#3a3a5e" stroke-width="1.5"/>

  <!-- Inner border glow -->
  <polygon points="310,110 690,110 690,200 310,200" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

  <!-- NEEL SALOT - geometric text -->
  <text x="500" y="138" font-family="monospace" font-size="38" font-weight="bold" fill="#e0e0ff" text-anchor="middle" letter-spacing="8" filter="url(#glow)">NEEL SALOT</text>

  <!-- Separator line -->
  <line x1="340" y1="148" x2="660" y2="148" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Role text -->
  <text x="500" y="166" font-family="monospace" font-size="13" fill="#7a7aaa" text-anchor="middle" letter-spacing="3">FULL STACK DEVELOPER</text>
  <text x="500" y="182" font-family="monospace" font-size="11" fill="#5a5a8a" text-anchor="middle" letter-spacing="2">AI BUILDER · SYSTEMS THINKER</text>

  <!-- Corner accents -->
  <path d="M305,105 L305,125 M305,105 L325,105" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M695,105 L695,125 M695,105 L675,105" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M305,205 L305,185 M305,205 L325,205" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M695,205 L695,185 M695,205 L675,205" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8"/>


  <!-- ══════════════════════════════════════════════════════ -->
  <!-- RIGHT BLOCK - ISOMETRIC CUBE "AI"                   -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Front face -->
  <polygon points="740,130 880,130 880,210 740,210" fill="#12121f" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Top face -->
  <polygon points="740,130 880,130 920,110 780,110" fill="#1a1a28" stroke="#2a2a3e" stroke-width="1"/>
  <!-- Right face -->
  <polygon points="880,130 920,110 920,190 880,210" fill="#0d0d18" stroke="#2a2a3e" stroke-width="1"/>

  <!-- Neural network pattern on AI cube -->
  <g stroke="#bd93f9" stroke-width="0.8" opacity="0.5">
    <line x1="760" y1="170" x2="790" y2="155"/>
    <line x1="780" y1="175" x2="810" y2="160"/>
    <line x1="800" y1="170" x2="830" y2="155"/>
    <line x1="820" y1="175" x2="850" y2="160"/>
    <line x1="840" y1="170" x2="860" y2="158"/>
    <line x1="790" y1="155" x2="810" y2="165"/>
    <line x1="810" y1="160" x2="830" y2="165"/>
    <line x1="830" y1="155" x2="850" y2="162"/>
  </g>

  <!-- AI node dots -->
  <circle cx="760" cy="170" r="3" fill="#bd93f9" opacity="0.7"/>
  <circle cx="780" cy="175" r="3" fill="#bd93f9" opacity="0.7"/>
  <circle cx="800" cy="170" r="3" fill="#bd93f9" opacity="0.7"/>
  <circle cx="820" cy="175" r="3" fill="#bd93f9" opacity="0.7"/>
  <circle cx="840" cy="170" r="3" fill="#bd93f9" opacity="0.7"/>
  <circle cx="860" cy="158" r="3" fill="#bd93f9" filter="url(#glow)"/>
  <circle cx="810" cy="165" r="3" fill="#bd93f9" opacity="0.8"/>
  <circle cx="830" cy="162" r="3" fill="#bd93f9" opacity="0.8"/>
  <circle cx="850" cy="158" r="3" fill="#bd93f9" filter="url(#glow)"/>

  <!-- Cube label -->
  <text x="810" y="196" font-family="monospace" font-size="10" fill="#6a6a9a" text-anchor="middle">AI · LLM</text>

  <!-- Active indicator -->
  <circle cx="880" cy="136" r="3" fill="#bd93f9" filter="url(#strongGlow)"/>


  <!-- ══════════════════════════════════════════════════════ -->
  <!-- CONNECTING LINES BETWEEN BLOCKS                      -->
  <!-- ══════════════════════════════════════════════════════ -->

  <line x1="260" y1="160" x2="305" y2="155" stroke="#2a2a3e" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="695" y1="155" x2="740" y2="160" stroke="#2a2a3e" stroke-width="1" stroke-dasharray="4,4"/>


  <!-- ══════════════════════════════════════════════════════ -->
  <!-- BOTTOM BAR - STRUCTURAL DECORATION                   -->
  <!-- ══════════════════════════════════════════════════════ -->

  <line x1="0" y1="255" x2="900" y2="255" stroke="#1a1a30" stroke-width="1"/>
  <line x1="0" y1="253" x2="900" y2="253" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Bottom corner markers -->
  <text x="20" y="270" font-family="monospace" font-size="9" fill="#2a2a4a">╔</text>
  <text x="880" y="270" font-family="monospace" font-size="9" fill="#2a2a4a">╗</text>

  <!-- Status indicators -->
  <circle cx="700" cy="265" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="710" cy="265" r="2" fill="#bd93f9" opacity="0.5"/>
  <circle cx="720" cy="265" r="2" fill="#50fa7b" opacity="0.5"/>
  <text x="730" y="268" font-family="monospace" font-size="8" fill="#3a3a5a">v2.0</text>

</svg>
