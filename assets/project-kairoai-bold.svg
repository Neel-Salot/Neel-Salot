<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    
    <linearGradient id="indigoFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#7986cb"/>
    </linearGradient>
    
    <linearGradient id="tealFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>
    
    <linearGradient id="roseFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec407a"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </linearGradient>

    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="softGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="420" fill="url(#cardBg2)" rx="16"/>

  <!-- Animated background elements -->
  <g stroke="#2a2a4a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="700" y2="80">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="160" x2="700" y2="160"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="320" x2="700" y2="320"/>
    <line x1="140" y1="0" x2="140" y2="420"/>
    <line x1="280" y1="0" x2="280" y2="420"/>
    <line x1="420" y1="0" x2="420" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
  </g>

  <!-- Floating geometric accents -->
  <g opacity="0.1">
    <polygon points="650,40 670,70 630,70" fill="none" stroke="#5c6bc0" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 650 55" to="360 650 55" dur="15s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="60" cy="380" r="15" fill="none" stroke="#26a69a" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 60 380" to="360 60 380" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title section -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="6" height="40" rx="3" fill="url(#indigoFlow)" filter="url(#glow2)"/>
    <text x="20" y="30" font-family="Georgia, serif" font-size="26" fill="#ffffff" font-weight="600">
      Kairo AI
    </text>
    <text x="20" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#5c6bc0" letter-spacing="1">
      BREAKING BARRIERS WITH COMPUTER VISION
    </text>
  </g>

  <!-- Conference badge -->
  <g transform="translate(480, 45)">
    <rect x="0" y="-15" width="170" height="30" rx="15" fill="#5c6bc0" opacity="0.15"/>
    <text x="85" y="5" font-family="-apple-system, sans-serif" font-size="10" fill="#5c6bc0" text-anchor="middle" letter-spacing="1">
      ★ ACAI-2026 PUBLISHED
    </text>
  </g>

  <!-- Hand detection visualization -->
  <g transform="translate(50, 110)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#4a6a8a" letter-spacing="1">◉ REAL-TIME DETECTION</text>
    
    <g transform="translate(10, 15)">
      <!-- Animated hand skeleton -->
      <g stroke="#5c6bc0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
        <path d="M30,50 L30,70 L50,70 L50,50 Z">
          <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
        </path>
        <g>
          <line x1="30" y1="50" x2="25" y2="30">
            <animate attributeName="x2" values="25;20;25" dur="1.5s" repeatCount="indefinite"/>
          </line>
          <line x1="37" y1="50" x2="37" y2="25">
            <animate attributeName="y2" values="25;20;25" dur="1.2s" repeatCount="indefinite"/>
          </line>
          <line x1="44" y1="50" x2="49" y2="30">
            <animate attributeName="x2" values="49;54;49" dur="1.4s" repeatCount="indefinite"/>
          </line>
          <line x1="50" y1="50" x2="55" y2="35">
            <animate attributeName="x2" values="55;60;55" dur="1.3s" repeatCount="indefinite"/>
          </line>
        </g>
      </g>
      
      <!-- Detection confidence -->
      <g transform="translate(90, 30)">
        <rect x="0" y="0" width="80" height="30" rx="6" fill="#1a1a2e" stroke="#26a69a" stroke-width="1"/>
        <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#26a69a" text-anchor="middle" font-weight="bold">97.3%</text>
        <circle cx="68" cy="15" r="4" fill="#26a69a">
          <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#26a69a;#4db6ac;#26a69a" dur="1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Tech stack flow -->
  <g transform="translate(50, 185)">
    <!-- Flow arrows -->
    <line x1="80" y1="25" x2="150" y2="25" stroke="url(#indigoFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#5c6bc0" filter="url(#softGlow2)">
      <animate attributeName="cx" values="80;150" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <line x1="230" y1="25" x2="300" y2="25" stroke="url(#tealFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </line>
    <circle r="4" fill="#26a69a" filter="url(#softGlow2)">
      <animate attributeName="cx" values="230;300" dur="1s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    
    <line x1="380" y1="25" x2="450" y2="25" stroke="url(#roseFlow)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite" begin="0.8s"/>
    </line>
    <circle r="4" fill="#ec407a" filter="url(#softGlow2)">
      <animate attributeName="cx" values="380;450" dur="1s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <!-- Node boxes -->
    <g>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#5c6bc0" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#5c6bc0" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#5c6bc0" text-anchor="middle" font-weight="bold">FLUTTER</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Mobile App</text>
    </g>

    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#26a69a" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#26a69a" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#26a69a" text-anchor="middle" font-weight="bold">MEDIAPIPE</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Hand Tracking</text>
    </g>

    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#ec407a" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#ec407a" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#ec407a" text-anchor="middle" font-weight="bold">TENSORFLOW</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Gesture ML</text>
    </g>

    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#f48fb1" stroke-width="1.5"/>
      <rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="#f48fb1" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </rect>
      <text x="60" y="22" font-family="monospace" font-size="12" fill="#f48fb1" text-anchor="middle" font-weight="bold">FIREBASE</text>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4a6a8a" text-anchor="middle">Backend</text>
    </g>
  </g>

  <!-- Learning modules -->
  <g transform="translate(50, 270)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" fill="#6a6a8a" letter-spacing="1">LEARNING MODULES</text>
    
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#1a1a2e" stroke="#5c6bc0" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="65" rx="8" fill="none" stroke="#5c6bc0" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="15" y="22" font-family="monospace" font-size="11" fill="#5c6bc0" font-weight="bold">A-Z ALPHABET</text>
      <text x="15" y="40" font-family="-apple-system, sans-serif" font-size="9" fill="#6a6a8a">Hand sign recognition</text>
      <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#4a8a6a">26 signs • 97% accuracy</text>
    </g>

    <g transform="translate(215, 15)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#1a1a2e" stroke="#26a69a" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="65" rx="8" fill="none" stroke="#26a69a" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <text x="15" y="22" font-family="monospace" font-size="11" fill="#26a69a" font-weight="bold">WORD PRACTICE</text>
      <text x="15" y="40" font-family="-apple-system, sans-serif" font-size="9" fill="#6a6a8a">Common phrases</text>
      <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#4a8a6a">50+ words • Real-time</text>
    </g>

    <g transform="translate(430, 15)">
      <rect x="0" y="0" width="195" height="65" rx="8" fill="#1a1a2e" stroke="#ec407a" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="65" rx="8" fill="none" stroke="#ec407a" stroke-width="1" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <text x="15" y="22" font-family="monospace" font-size="11" fill="#ec407a" font-weight="bold">QUIZ MODE</text>
      <text x="15" y="40" font-family="-apple-system, sans-serif" font-size="9" fill="#6a6a8a">Test your skills</text>
      <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#4a8a6a">Adaptive difficulty</text>
    </g>
  </g>

  <!-- Bottom status -->
  <g transform="translate(50, 385)">
    <rect x="0" y="0" width="600" height="25" rx="12" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1"/>
    <text x="20" y="17" font-family="monospace" font-size="10" fill="#5c6bc0">▸ KairoAI: Indian Sign Language Learning Platform</text>
    <text x="540" y="17" font-family="-apple-system, sans-serif" font-size="10" fill="#26a69a" text-anchor="end">
      <tspan fill="#26a69a">●</tspan> ACAI-2026
    </text>
  </g>

  <!-- Corner accents -->
  <g>
    <circle cx="20" cy="395" r="4" fill="#5c6bc0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="395" r="4" fill="#ec407a" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>
