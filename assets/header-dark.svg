<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27" stop-opacity="1" />
      <stop offset="100%" stop-color="#1565c0" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="50%" stop-color="#161b22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>
    
    <style>
      .glow-text {
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.6), 0 0 20px rgba(0, 242, 254, 0.3);
      }
      .sub-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 400;
        fill: #8b949e;
        letter-spacing: 3px;
      }
      .node-pulse {
        animation: pulse 3s infinite alternate;
      }
      .line-flow {
        stroke-dasharray: 10, 15;
        animation: flow 20s linear infinite;
      }
      @keyframes pulse {
        0% { r: 4; opacity: 0.4; }
        100% { r: 8; opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -250; }
      }
      .orbit {
        animation: rotate 30s linear infinite;
        transform-origin: 850px 160px;
      }
      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" fill="#0d1117"/>
  
  <!-- Cyberpunk grid matrix -->
  <g opacity="0.3">
    <path d="M 0,40 L 1000,40 M 0,80 L 1000,80 M 0,120 L 1000,120 M 0,160 L 1000,160 M 0,200 L 1000,200 M 0,240 L 1000,240 M 0,280 L 1000,280" stroke="#1f293d" stroke-width="1"/>
    <path d="M 100,0 L 100,320 M 200,0 L 200,320 M 300,0 L 300,320 M 400,0 L 400,320 M 500,0 L 500,320 M 600,0 L 600,320 M 700,0 L 700,320 M 800,0 L 800,320 M 900,0 L 900,320" stroke="#1f293d" stroke-width="1"/>
  </g>
  
  <!-- System Architecture Flow Simulation -->
  <g opacity="0.5">
    <path class="line-flow" d="M 50,160 L 250,90 L 500,160 L 750,90 L 950,160" fill="none" stroke="url(#neonGlow)" stroke-width="2"/>
    <path class="line-flow" d="M 50,160 L 250,230 L 500,160 L 750,230 L 950,160" fill="none" stroke="#8a2be2" stroke-width="2" style="animation-duration: 15s; animation-direction: reverse;"/>
    
    <!-- Nodes -->
    <circle class="node-pulse" cx="250" cy="90" r="5" fill="#00f2fe"/>
    <circle class="node-pulse" cx="250" cy="230" r="5" fill="#8a2be2" style="animation-delay: 1.5s;"/>
    <circle class="node-pulse" cx="500" cy="160" r="6" fill="#00f2fe" style="animation-delay: 0.7s;"/>
    <circle class="node-pulse" cx="750" cy="90" r="5" fill="#8a2be2" style="animation-delay: 2.2s;"/>
    <circle class="node-pulse" cx="750" cy="230" r="5" fill="#00f2fe" style="animation-delay: 0.3s;"/>
  </g>
  
  <!-- Planet/Brain abstract orbit visual on the right -->
  <g class="orbit" opacity="0.4">
    <circle cx="850" cy="160" r="80" fill="none" stroke="#21262d" stroke-width="1"/>
    <circle cx="850" cy="160" r="110" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5,10"/>
    <circle cx="850" cy="160" r="50" fill="none" stroke="url(#neonGlow)" stroke-width="1.5" opacity="0.7"/>
    <circle cx="770" cy="160" r="6" fill="#00f2fe"/>
    <circle cx="940" cy="210" r="4" fill="#8a2be2"/>
  </g>

  <!-- Typography Content -->
  <g transform="translate(80, 0)">
    <!-- Terminal prefix style -->
    <text x="0" y="105" font-family="'Fira Code', 'Courier New', monospace" font-size="16" fill="#00f2fe">&gt;_ USER_ID: NEEL SALOT</text>
    
    <!-- Title -->
    <text x="0" y="165" class="glow-text" font-size="48">SYSTEMS THINKER</text>
    
    <!-- Subtitle -->
    <text x="0" y="215" class="sub-text" font-size="14">AI BUILDER // FULL STACK DEVELOPER</text>
    
    <!-- Tech chips -->
    <rect x="0" y="240" width="80" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="255" font-family="'Fira Code', monospace" font-size="10" fill="#58a6ff" text-anchor="middle">AgenticAI</text>
    
    <rect x="90" y="240" width="70" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="125" y="255" font-family="'Fira Code', monospace" font-size="10" fill="#58a6ff" text-anchor="middle">React</text>
    
    <rect x="170" y="240" width="80" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="210" y="255" font-family="'Fira Code', monospace" font-size="10" fill="#58a6ff" text-anchor="middle">Node/Py</text>
    
    <rect x="260" y="240" width="85" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="302" y="255" font-family="'Fira Code', monospace" font-size="10" fill="#58a6ff" text-anchor="middle">Supabase</text>
  </g>
</svg>
