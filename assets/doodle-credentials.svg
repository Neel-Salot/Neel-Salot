<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Fredoka:wght@500;600;700&amp;display=swap');
    
    .section-title {
      font-family: 'Caveat', cursive;
      font-size: 28px;
      font-weight: 700;
      fill: #1A1A1A;
    }
    .category-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #2C3E50;
    }
    .stat-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #1A1A1A;
    }
    .stat-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      font-weight: bold;
      fill: #3A3A3A;
    }
  </style>

  <!-- Outer Shadow -->
  <path d="M 14,14 Q 400,12 790,14 Q 792,126 790,248 Q 400,250 14,248 Q 12,126 14,14 Z" fill="rgba(26, 26, 26, 0.12)" />

  <!-- Outer Card Body -->
  <path d="M 8,8 Q 400,6 784,8 Q 786,124 784,244 Q 400,246 8,244 Q 6,124 8,8 Z" fill="#FFDFDF" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Section Title -->
  <text x="30" y="42" class="section-title">Education &amp; Research</text>

  <!-- Graduation Cap Doodle (Top Right) -->
  <g transform="translate(-5, -5)">
    <!-- Cap Diamond -->
    <path d="M 740,23 L 762,31 L 740,39 L 718,31 Z" fill="#FFE600" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cap Base -->
    <path d="M 727,35 L 727,45 C 727,49 753,49 753,45 L 753,35" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tassel -->
    <path d="M 740,31 L 760,40 M 760,40 L 760,47" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- ACADEMICS CARD -->
  <g transform="translate(35, 68)">
    <!-- Shadow -->
    <path d="M 6,6 Q 180,5 359,6 Q 360,82 359,158 Q 180,159 6,158 Q 5,82 6,6 Z" fill="rgba(0,0,0,0.1)" />
    <!-- Box -->
    <path d="M 0,0 Q 180,-1 353,0 Q 354,77 353,152 Q 180,153 0,152 Q -1,77 0,0 Z" fill="#FFF2E2" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[Education]</text>
    <path d="M 15,31 Q 120,30 200,31" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" />
    
    <text x="15" y="55" class="stat-label">Degree  : <tspan class="stat-value" font-weight="normal">B.Sc. Information Technology</tspan></text>
    <text x="15" y="73" class="stat-label">College : <tspan class="stat-value" font-weight="normal">BMIIT, Surat (2023 - 2026)</tspan></text>
    <text x="15" y="91" class="stat-label">CGPA    : <tspan class="stat-value">9.46 / 10.0</tspan></text>
    <text x="15" y="109" class="stat-label">Honors  : <tspan class="stat-value">2x Semester Topper (Excellence)</tspan></text>
    
    <line x1="15" y1="118" x2="340" y2="118" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 2" />
    <text x="15" y="136" class="stat-label">Class XII (GSEB) : <tspan class="stat-value" font-weight="normal">Jeevan Bharti, Surat (90.13%)</tspan></text>
  </g>

  <!-- RESEARCH & PUBLICATIONS CARD -->
  <g transform="translate(410, 68)">
    <!-- Shadow -->
    <path d="M 6,6 Q 180,5 359,6 Q 360,82 359,158 Q 180,159 6,158 Q 5,82 6,6 Z" fill="rgba(0,0,0,0.1)" />
    <!-- Box -->
    <path d="M 0,0 Q 180,-1 353,0 Q 354,77 353,152 Q 180,153 0,152 Q -1,77 0,0 Z" fill="#E8F6EF" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Content -->
    <text x="15" y="24" class="category-title">[Research &amp; Publications]</text>
    <path d="M 15,31 Q 120,30 200,31" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" />
    
    <text x="15" y="55" class="stat-label">■ Autism Support Platform (CSRI)</text>
    <text x="30" y="72" class="stat-value">- BEST RESEARCH PAPER AWARD 🏆</text>
    <text x="30" y="87" class="stat-value">- ML pattern stress detection models</text>
    
    <line x1="15" y1="98" x2="340" y2="98" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 2" />
    
    <text x="15" y="117" class="stat-label">■ KairoAI ISL Gesture Platform</text>
    <text x="30" y="134" class="stat-value">- Presented at ACAI-2026 Conference</text>
    <text x="30" y="149" class="stat-value">- Real-time hand skeletal tracking</text>
  </g>
</svg>
