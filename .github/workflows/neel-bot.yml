name: Neel-Bot Agent Loop

on:
  issues:
    types: [opened]

jobs:
  run-agent:
    if: contains(github.event.issue.labels.*.name, 'neel-bot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm init -y
            npm install @google/generative-ai dotenv
          fi

      - name: Run Neel-Bot Agent Logic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node scripts/neel-bot.js

      - name: Commit & Push README Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/console.svg assets/console-light.svg scripts/system-state.json
          git diff-index --quiet HEAD || git commit -m "🤖 Neel-Bot: updated agent state console logs [skip ci]"
          git push
