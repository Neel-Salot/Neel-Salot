name: ☕ Buy Neel a Virtual Coffee
description: Energize the agent's core processor with a virtual coffee.
title: "☕ Buy Neel a Virtual Coffee from [Your Name]"
labels: ["neel-bot", "coffee"]
body:
  - type: markdown
    attributes:
      value: |
        ### Overclock the Processor!
        Support Neel's open source builds by sending a virtual coffee. This will update the console status to ENERGIZED.
  - type: input
    id: donor_name
    attributes:
      label: Your Name / Github Username
      placeholder: E.g., @octocat
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Send a Message of Support
      placeholder: E.g., Keep shipping cool projects!
    validations:
      required: false
