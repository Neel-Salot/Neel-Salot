name: 🐒 Release Chaos Monkey
description: Trigger a chaos engineering simulation by crashing an agent node on the profile dashboard.
title: "🐒 Release Chaos Monkey on the Profile"
labels: ["neel-bot", "chaos"]
body:
  - type: markdown
    attributes:
      value: |
        ### Warning: Testing Resiliency
        This triggers a simulated failure on the profile cluster. The Chaos Monkey will randomly target and shut down one of the project nodes (`Momentum AI`, `KairoAI`, `DailyNest`, or `FlexiGrow`).
        The profile dashboard will visualise the outage in real-time, and other visitors will need to deploy a **Self-Healing Patch** to restore it!
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm Attack
      options:
        - label: I confirm that I want to release the Chaos Monkey, crash an agent node, and test the community's reaction time!
          required: true
